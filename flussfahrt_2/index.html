<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f8f5b">
<meta name="description" content="Capybara Fluss-Lauf: Schwimm mit Capy den Fluss hinunter, sammle Orangen und weiche Piranhas, Baumstämmen, Strudeln und Krokodilen aus.">
<title>Capybara Fluss-Lauf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #7cc46a; --fg: #1f3326;
    --pill: rgba(255,255,255,.88); --pillfg: #24412f; --pillline: rgba(36,65,47,.12);
    --panel: #ffffff; --panelfg: #23372b; --panelmuted: #5c6f63; --line: #d5e8da;
    --accent: #ff9a1f; --accentfg: #ffffff; --accent2: #2f8f5b; --heart: #ef4452;
    --shade: rgba(10,40,30,.38);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pill: rgba(22,34,30,.86); --pillfg: #eaf6ee; --pillline: rgba(255,255,255,.12);
      --panel: #1c2a24; --panelfg: #eaf6ee; --panelmuted: #a5bcae; --line: #2f463b;
      --accent2: #6fd39a; --shade: rgba(0,10,8,.55);
    }
  }
  :root[data-theme="dark"] {
    --pill: rgba(22,34,30,.86); --pillfg: #eaf6ee; --pillline: rgba(255,255,255,.12);
    --panel: #1c2a24; --panelfg: #eaf6ee; --panelmuted: #a5bcae; --line: #2f463b;
    --accent2: #6fd39a; --shade: rgba(0,10,8,.55);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 8px calc(10px + env(safe-area-inset-left, 0px));
  }
  .pill {
    background: var(--pill); color: var(--pillfg); border: 1px solid var(--pillline);
    border-radius: 999px; padding: 6px 12px; min-height: 44px; display: flex; align-items: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #lives { font-size: 21px; letter-spacing: 1px; line-height: 1; color: var(--heart); }
  #lives .off { opacity: .22; color: var(--pillfg); }
  #scorebox { flex-direction: column; gap: 0; line-height: 1; padding: 5px 16px; min-width: 88px; justify-content: center; }
  #score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #dist { font-size: 12px; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hbtns { display: flex; gap: 8px; pointer-events: auto; }
  .ibtn {
    width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 1px solid var(--pillline);
    background: var(--pill); color: var(--pillfg); display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); touch-action: manipulation;
  }
  .ibtn svg { width: 22px; height: 22px; }
  .ibtn:active { transform: scale(.94); }
  #wrap.menu #lives, #wrap.menu #scorebox, #wrap.menu #pause { visibility: hidden; }
  #ov {
    position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--shade);
  }
  #ov.hidden { display: none; }
  .card {
    background: var(--panel); color: var(--panelfg); border: 1px solid var(--line);
    border-radius: 22px; padding: 20px 18px 18px; width: 100%; max-width: 430px; max-height: 100%;
    overflow-y: auto; touch-action: pan-y; box-shadow: 0 14px 40px rgba(0,0,0,.25);
    -webkit-overflow-scrolling: touch;
  }
  .card.wide { max-width: 560px; }
  .card h1 { font-size: 30px; line-height: 1.05; margin: 0 0 6px; font-weight: 700; color: var(--accent2); }
  .card h2 { font-size: 20px; margin: 14px 0 6px; font-weight: 600; }
  .card p { margin: 0 0 10px; font-size: 17px; line-height: 1.35; }
  .muted { color: var(--panelmuted); }
  .small { font-size: 14px !important; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .head canvas { flex: none; }
  .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
  .diff {
    border: 2px solid var(--line); background: transparent; color: var(--panelfg); border-radius: 14px;
    padding: 10px 4px; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; min-height: 52px; touch-action: manipulation;
  }
  .diff[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,154,31,.15); }
  #diffdesc { min-height: 1.35em; text-align: center; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px 14px; margin-top: 10px;
    font-family: inherit; font-size: 21px; font-weight: 700; cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--accent); color: var(--accentfg); box-shadow: 0 4px 0 #d67a0c; }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #d67a0c; }
  .btn.secondary { background: transparent; color: var(--panelfg); border: 2px solid var(--line); font-size: 18px; font-weight: 600; padding: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .btn { margin-top: 8px; }
  .big { font-size: 54px; font-weight: 700; line-height: 1; margin: 6px 0 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 10px 0 4px; font-size: 16px; }
  .stats b { font-weight: 600; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 6px 0 4px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 1.2; }
  .legend canvas { flex: none; width: 44px; height: 44px; }
  .legend small { display: block; color: var(--panelmuted); font-size: 13px; }
  .keys { font-size: 15px; line-height: 1.4; margin: 0 0 6px; padding-left: 18px; }
  .badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }
  @media (max-width: 380px) {
    .card { padding: 16px 14px 14px; }
    .card h1 { font-size: 25px; }
    .legend { grid-template-columns: 1fr; }
    #lives { font-size: 18px; letter-spacing: 0; }
    .pill { padding: 6px 9px; }
    #scorebox { min-width: 74px; padding: 5px 10px; }
  }
  @media (max-height: 480px) {
    .card h1 { font-size: 24px; }
    .head canvas { width: 70px; height: 52px; }
    .btn { padding: 11px; font-size: 19px; }
  }
</style>
</head>
<body>
<div id="wrap" class="menu">
  <canvas id="c" aria-label="Spielfeld: Fluss mit Capybara"></canvas>
  <div id="hud">
    <div class="pill" id="lives" aria-label="Leben"></div>
    <div class="pill" id="scorebox"><span id="score">0</span><span id="dist">0 m</span></div>
    <div class="hbtns">
      <button class="ibtn" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
      <button class="ibtn" id="mute" aria-label="Ton aus"></button>
    </div>
  </div>
  <div id="ov"><div class="card" id="card" role="dialog" aria-live="polite"></div></div>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let g = ctx; // aktueller Zeichen-Kontext (wird für Symbole umgeschaltet)
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const FONT = '"Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif';
  const store = {
    get(k, d) { try { const v = localStorage.getItem('flussfahrt2-' + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('flussfahrt2-' + k, String(v)); } catch (e) {} }
  };

  // ---------- Einstellungen ----------
  const DIFFS = [
    { n: 'Leicht', d: '5 Herzen, gemütliches Tempo, weniger Hindernisse', lives: 5, max: 6, speed: 0.78, dens: 0.62, inv: 2.4, hunt: false, pw: 0.7, heart: 0.65 },
    { n: 'Normal', d: '3 Herzen – manche Piranhas jagen dich', lives: 3, max: 5, speed: 1, dens: 1, inv: 1.8, hunt: true, pw: 1, heart: 1 },
    { n: 'Schwer', d: '3 Herzen, schnell und wild', lives: 3, max: 3, speed: 1.22, dens: 1.3, inv: 1.5, hunt: true, pw: 1.2, heart: 1.3 }
  ];
  let DIFF = clamp(parseInt(store.get('diff', '1'), 10) || 0, 0, 2);
  if (store.get('diff', null) === null) DIFF = 1;

  const SECLEN = 200; // Meter pro Abschnitt
  const SECTIONS = [
    { n: 'Ruhiges Wasser', pool: { rock: 3, log: 3, pir: 2 } },
    { n: 'Piranha-Bucht', pool: { rock: 2, log: 2, pir: 5, school: 2 } },
    { n: 'Strudel-Schlucht', pool: { rock: 3, log: 2, pir: 3, pool: 2.5 } },
    { n: 'Krokodil-Sumpf', pool: { log: 2, pir: 3, croc: 3, rock: 1, pool: 1 } },
    { n: 'Wilde Stromschnellen', pool: { rock: 3, log: 2, pir: 3, croc: 1.5, pool: 1.5, school: 1 }, rapids: true }
  ];
  const PALS = [
    { w1: [92, 186, 230], w2: [44, 138, 206], deep: [26, 98, 168], gr: [126, 202, 96], gr2: [100, 178, 80], sand: [238, 216, 162] },
    { w1: [74, 196, 206], w2: [30, 146, 184], deep: [20, 104, 148], gr: [146, 208, 88], gr2: [116, 184, 72], sand: [244, 222, 166] },
    { w1: [88, 160, 214], w2: [44, 116, 186], deep: [28, 82, 150], gr: [150, 176, 112], gr2: [124, 150, 96], sand: [206, 196, 176] },
    { w1: [96, 164, 132], w2: [58, 128, 104], deep: [38, 96, 84], gr: [96, 164, 84], gr2: [72, 138, 66], sand: [176, 164, 112] },
    { w1: [80, 176, 236], w2: [36, 122, 214], deep: [22, 88, 182], gr: [112, 194, 98], gr2: [86, 168, 82], sand: [228, 212, 172] }
  ];

  // ---------- Geometrie ----------
  const RIVER_W = 7.6; // Flussbreite in Einheiten
  let W = 1, H = 1, U = 40, VH = 10, VW = 10, AMP = 0, DPR = 1, T = 0, HUDH = 60;
  const cxAt = wy => AMP * (0.7 * Math.sin(wy * 0.043) + 0.3 * Math.sin(wy * 0.11 + 1.3));
  const hwAt = wy => RIVER_W / 2 - 0.22 - 0.22 * Math.sin(wy * 0.21 + 0.8 * Math.sin(wy * 0.067));
  const sx = (x, wy) => W / 2 + (cxAt(wy) + x) * U;
  const sy = wy => H - (wy - G.dist) * U;
  const pyMax = () => Math.max(2.6, Math.min(VH * 0.6, VH - 2.4));

  function resize() {
    const r = cv.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = clamp(Math.min(W * 0.86 / RIVER_W, H / 8.6), 22, 66);
    VH = H / U; VW = W / U;
    AMP = clamp((W / 2 - (RIVER_W / 2) * U - 20) / U, 0, 2.4);
    HUDH = ($('hud').offsetHeight || 60);
    if (G && G.p) G.p.py = clamp(G.p.py, 1.3, pyMax());
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  // ---------- Spielzustand ----------
  let G = null, state = 'menu', last = 0;
  const clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: Math.random(), y: Math.random() * 900, r: rnd(140, 260) });

  function newGame(demo) {
    const D = DIFFS[DIFF];
    G = {
      demo, t: 0, dist: 0, distPts: 0, speed: demo ? 1.6 : 0.6, wflow: 0,
      lives: D.lives, maxLives: D.max, bonus: 0, score: 0, fruits: 0, bestCombo: 0,
      combo: 0, comboT: 0, sec: 0, obs: [], deco: [], parts: [], rings: [], floats: [],
      nextRow: 9, nextFruit: 4, nextHeart: 45, nextPw: 28 * D.pw, nextRapid: Infinity, decoWy: -4,
      shield: 0, magnet: 0, slow: 0, inv: 0, shake: 0, flash: 0, rapid: null, banner: null,
      dieT: 0, wakeT: 0, hintT: demo ? 0 : 6, pulled: false, palFrom: 0, palTo: 0, palT: 1,
      p: { x: 0, py: 2.8, vx: 0, vy: 0, ex: 0, ey: 0, rot: 0, paddle: 0 }
    };
    if (demo) G.p.py = Math.min(4, pyMax());
    fillDeco();
    // Ein paar Seerosen als Deko im Wasser
  }

  // ---------- Sound (Web Audio, alles synthetisch) ----------
  const A = { ctx: null, master: null, sfx: null, mus: null, noise: null, muted: store.get('mute', '0') === '1', last: {} };
  function audioInit() {
    if (A.ctx) { if (A.ctx.state === 'suspended') { try { A.ctx.resume(); } catch (e) {} } return; }
    try {
      A.ctx = new (window.AudioContext || window.webkitAudioContext)();
      A.master = A.ctx.createGain(); A.master.connect(A.ctx.destination);
      A.sfx = A.ctx.createGain(); A.sfx.gain.value = 1; A.sfx.connect(A.master);
      A.mus = A.ctx.createGain(); A.mus.gain.value = 0.3; A.mus.connect(A.master);
      const b = A.ctx.createBuffer(1, A.ctx.sampleRate, A.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      A.noise = b; applyMute();
    } catch (e) { A.ctx = null; }
  }
  const SPK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function applyMute() {
    if (A.master) A.master.gain.value = A.muted ? 0 : 0.6;
    const m = $('mute'); m.innerHTML = A.muted ? SPK_OFF : SPK_ON;
    m.setAttribute('aria-label', A.muted ? 'Ton an (M)' : 'Ton aus (M)');
  }
  function osc(t, f, dur, type, vol, slide, dest) {
    const o = A.ctx.createOscillator(), gn = A.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide && slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + 0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(dest || A.sfx); o.start(t); o.stop(t + dur + 0.03);
  }
  function nz(t, dur, vol, f, q, ftype, dest, fEnd) {
    const src = A.ctx.createBufferSource(), fl = A.ctx.createBiquadFilter(), gn = A.ctx.createGain();
    src.buffer = A.noise; fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(gn); gn.connect(dest || A.sfx); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.03);
  }
  function play(name, gap, fn) {
    if (!A.ctx || A.muted) return;
    const now = A.ctx.currentTime;
    if (gap && A.last[name] && now - A.last[name] < gap) return;
    A.last[name] = now;
    try { fn(now); } catch (e) {}
  }
  const sfx = {
    pick: c => play('pick', 0.03, t => { const f = 620 * Math.pow(2, Math.min(c - 1, 8) * 2 / 12); osc(t, f, 0.1, 'triangle', 0.16, 1.4); osc(t + 0.05, f * 1.5, 0.12, 'sine', 0.1, 1); }),
    gold: () => play('gold', 0, t => [784, 988, 1175, 1568].forEach((f, i) => osc(t + i * 0.055, f, 0.16, 'triangle', 0.13, 1))),
    heart: () => play('heart', 0, t => { osc(t, 523, 0.16, 'sine', 0.22, 1); osc(t + 0.12, 784, 0.3, 'sine', 0.22, 1); }),
    power: () => play('pw', 0, t => { [392, 523, 659, 784, 1047].forEach((f, i) => osc(t + i * 0.06, f, 0.15, 'square', 0.05, 1)); nz(t, 0.3, 0.05, 4000, 0.5, 'highpass'); }),
    hurt: () => play('hurt', 0.2, t => { osc(t, 330, 0.35, 'sine', 0.3, 0.35); nz(t, 0.3, 0.22, 700, 0.8, 'lowpass'); osc(t + 0.02, 110, 0.25, 'triangle', 0.2, 0.6); }),
    shield: () => play('shield', 0.2, t => { nz(t, 0.2, 0.2, 2600, 1.2, 'bandpass'); osc(t, 900, 0.25, 'sine', 0.14, 0.5); }),
    whirl: () => play('whirl', 1.4, t => { nz(t, 1, 0.1, 300, 5, 'bandpass', null, 900); }),
    snap: () => play('snap', 0.6, t => { nz(t, 0.05, 0.3, 1900, 1.2, 'bandpass'); nz(t + 0.1, 0.06, 0.3, 1500, 1.2, 'bandpass'); }),
    section: () => play('sec', 0, t => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => osc(t + i * 0.09, f, 0.18, 'triangle', 0.13, 1))),
    rapid: () => play('rapid', 0, t => { nz(t, 1.6, 0.14, 500, 0.6, 'bandpass', null, 2400); osc(t, 330, 0.5, 'triangle', 0.08, 2); }),
    start: () => play('start', 0, t => { nz(t, 0.35, 0.18, 1200, 0.7, 'lowpass', null, 300); osc(t + 0.05, 440, 0.1, 'sine', 0.12, 1.5); osc(t + 0.15, 660, 0.14, 'sine', 0.12, 1.3); }),
    over: () => play('over', 0, t => [523, 440, 349, 262].forEach((f, i) => osc(t + i * 0.2, f, 0.38, 'triangle', 0.17, 0.97))),
    click: () => play('click', 0.05, t => osc(t, 740, 0.06, 'sine', 0.1, 1.2))
  };
  // Kleine fröhliche Musik (pentatonisch), Tempo steigt mit dem Abschnitt
  const MEL = [523, 0, 659, 0, 784, 0, 659, 587, 523, 0, 440, 0, 523, 0, 0, 0,
    440, 0, 523, 0, 659, 0, 587, 523, 440, 0, 392, 0, 440, 0, 0, 0,
    587, 0, 659, 0, 784, 0, 880, 784, 659, 0, 587, 0, 659, 0, 0, 0,
    392, 0, 440, 0, 523, 0, 587, 659, 523, 0, 0, 0, 0, 0, 0, 0];
  const M = { timer: null, step: 0, next: 0 };
  function musicStart() {
    if (!A.ctx || M.timer) return;
    M.step = 0; M.next = A.ctx.currentTime + 0.1;
    M.timer = setInterval(() => {
      if (!A.ctx || state !== 'play') { if (A.ctx) M.next = A.ctx.currentTime + 0.05; return; }
      const bpm = 104 + Math.min(28, (G.dist / SECLEN) * 5) + (G.rapid ? 14 : 0);
      const spb = 60 / bpm / 2;
      while (M.next < A.ctx.currentTime + 0.12) { musicStep(M.step, M.next, spb); M.next += spb; M.step = (M.step + 1) % 64; }
    }, 30);
  }
  function musicStop() { clearInterval(M.timer); M.timer = null; }
  function musicStep(st, t, spb) {
    if (A.muted) return;
    const i = st % 16, bar = Math.floor(st / 16), mg = A.mus;
    const roots = [130.81, 110, 146.83, 98];
    if (i % 4 === 0) osc(t, roots[bar], spb * 3.2, 'triangle', 0.26, 1, mg);
    if (i % 4 === 2) osc(t, roots[bar] * 2, spb * 1.1, 'sine', 0.09, 1, mg);
    if (i % 2 === 1) nz(t, 0.03, 0.025, 8000, 1, 'highpass', mg);
    const f = MEL[st];
    if (f) { osc(t, f, 0.28, 'sine', 0.08, 1, mg); osc(t, f * 2, 0.12, 'sine', 0.02, 1, mg); }
  }

  // ---------- Deko am Ufer ----------
  const FLOWER_C = ['#ff7eb6', '#ffd84a', '#ffffff', '#b692ff', '#ff8a5c'];
  function fillDeco() {
    const top = G.dist + VH + 4;
    const bankW = Math.max(1.4, VW / 2 - RIVER_W / 2 + AMP + 0.6);
    while (G.decoWy < top) {
      G.decoWy += rnd(0.3, 0.8);
      const wy = G.decoWy, side = Math.random() < 0.5 ? -1 : 1, r = Math.random();
      let o;
      if (r < 0.25) o = { type: 'reed', off: rnd(0.02, 0.5) };
      else if (r < 0.38) o = { type: 'stone', off: rnd(-0.05, 0.45) };
      else if (r < 0.56) o = { type: 'flower', off: rnd(0.4, bankW) };
      else if (r < 0.75) o = { type: 'bush', off: rnd(0.55, bankW) };
      else { const s = rnd(0.8, 1.25); o = { type: 'tree', off: rnd(0.9 * s + 0.15, Math.max(0.9 * s + 0.3, bankW)) }; o.s = s; }
      o.wy = wy; o.side = side; o.s = o.s || rnd(0.8, 1.25); o.h = Math.random(); o.c = pick(FLOWER_C);
      G.deco.push(o);
      if (Math.random() < 0.1) G.deco.push({ type: 'lily', wy: wy + rnd(0, 0.4), side, off: -rnd(0.35, 0.9), s: rnd(0.7, 1.1), h: Math.random(), c: pick(['#ff9ecb', '#ffffff', '#ffd84a']) });
    }
    if (G.deco.length > 60 && G.deco[0].wy < G.dist - 4) G.deco = G.deco.filter(d => d.wy > G.dist - 4);
  }

  // ---------- Spawnen ----------
  function wpick(obj) {
    let sum = 0; for (const k in obj) sum += obj[k];
    let r = Math.random() * sum;
    for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
    return Object.keys(obj)[0];
  }
  const add = o => { o.age = 0; o.ph = o.ph == null ? rnd(0, TAU) : o.ph; G.obs.push(o); return o; };
  const HAZ = { rock: 1, log: 1, pir: 1, croc: 1, pool: 1 };
  function clearFruitsNear(x, wy, rad) {
    G.obs = G.obs.filter(o => !(o.k === 'fruit' && Math.abs(o.x - x) < rad && Math.abs(o.wy - wy) < rad));
  }
  function spawnRow() {
    const D = DIFFS[DIFF], lv = G.dist / SECLEN, S = SECTIONS[G.sec % 5];
    let pool = Object.assign({}, S.pool);
    if (G.sec >= 5) for (const k of ['rock', 'log', 'pir', 'school', 'pool', 'croc']) pool[k] = Math.max(pool[k] || 0, 1.2);
    if (G.rapid) pool = { rock: 4, log: 1.5, pir: 1 };
    const type = wpick(pool);
    const base = G.dist + VH + 1.8, hw = hwAt(base) - 0.55;
    let extra = 0;
    if (type === 'rock') {
      const n = Math.random() < 0.3 + Math.min(0.4, lv * 0.08) ? 2 : 1, xs = [];
      for (let i = 0; i < n; i++) {
        let x, tries = 0;
        do { x = rnd(-hw, hw); } while (xs.some(v => Math.abs(v - x) < 2.7) && ++tries < 12);
        xs.push(x);
        const o = add({ k: 'rock', x, wy: base + rnd(0, 0.7), r: rnd(0.45, 0.78), v: Array.from({ length: 9 }, () => rnd(0.84, 1.12)), moss: Math.random() });
        clearFruitsNear(o.x, o.wy, 1.2);
      }
    } else if (type === 'log') {
      const len = rnd(1.0, 1.5 + Math.min(0.3, lv * 0.05));
      const o = add({ k: 'log', x: rnd(-hw + len * 0.7, hw - len * 0.7), wy: base + 0.5, len, a: rnd(-0.35, 0.35), spin: rnd(-0.16, 0.16), flow: rnd(0.15, 0.35) });
      clearFruitsNear(o.x, o.wy, len + 0.6);
    } else if (type === 'pir') {
      const n = lv > 0.7 && Math.random() < 0.3 + Math.min(0.3, lv * 0.05) ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const beh = (D.hunt && lv >= 0.8 && Math.random() < 0.3 + Math.min(0.25, lv * 0.04)) ? 'hunt' : (Math.random() < 0.45 ? 'zig' : 'straight');
        add({ k: 'pir', beh, x: rnd(-hw, hw), wy: base + 2 + i * 1.7, vy: -(0.9 + rnd(0, 0.6) + Math.min(1, lv * 0.12)) * (DIFF === 0 ? 0.75 : 1), vx: 0 });
      }
    } else if (type === 'school') {
      const dir = Math.random() < 0.5 ? -1 : 1;
      for (let i = 0; i < 3; i++) add({ k: 'pir', beh: 'cross', x: clamp(-dir * (hw - i * 0.55), -hw, hw), wy: base + 2 + i * 0.9, vx: dir * rnd(1.3, 1.7), vy: -0.5 });
    } else if (type === 'pool') {
      const o = add({ k: 'pool', x: rnd(-hw + 1.3, hw - 1.3), wy: base + 1.5 });
      clearFruitsNear(o.x, o.wy, 2.2); extra = 3.2;
    } else if (type === 'croc') {
      const side = Math.random() < 0.5 ? -1 : 1;
      add({ k: 'croc', x: side * (hw - 0.4), wy: base + 1.6, vx: 0, r: 0, jaw: 0, snapped: false });
      extra = 2.2;
    }
    const gap = (3.7 - Math.min(1.5, lv * 0.22)) / D.dens * (G.rapid ? 1.2 : 1);
    G.nextRow = G.dist + gap * rnd(0.8, 1.25) + extra;
  }
  function hazardNear(x, wy, rad) {
    for (const o of G.obs) {
      if (!HAZ[o.k]) continue;
      const rr_ = o.k === 'pool' ? 2.6 : o.k === 'log' ? o.len + 0.6 : o.k === 'croc' ? 1.6 : rad;
      if (Math.abs(o.x - x) < rr_ && Math.abs(o.wy - wy) < rr_) return true;
    }
    return false;
  }
  function spawnFruit() {
    const base = G.dist + VH + 1.5, hw = hwAt(base) - 0.6;
    const n = Math.floor(rnd(3, 7)), pat = pick(['line', 'diag', 'wave']);
    let x0 = rnd(-hw, hw);
    const dx = pat === 'diag' ? (x0 > 0 ? -1 : 1) * rnd(0.35, 0.6) : 0, ph = rnd(0, TAU);
    const goldI = Math.random() < 0.09 ? Math.floor(n / 2) : -1;
    for (let i = 0; i < n; i++) {
      let x = x0 + dx * i + (pat === 'wave' ? Math.sin(ph + i * 0.9) * 1.2 : 0);
      x = clamp(x, -hw, hw);
      const wy = base + i * 0.95;
      if (hazardNear(x, wy, 1.2)) continue;
      add({ k: 'fruit', x, wy, gold: i === goldI });
    }
    G.nextFruit = G.dist + n * 0.95 + rnd(3, 7);
  }
  function spawnItem(k, type) {
    const base = G.dist + VH + 1.5, hw = hwAt(base) - 0.9;
    let x = rnd(-hw, hw), tries = 0;
    while (hazardNear(x, base, 1.6) && ++tries < 10) x = rnd(-hw, hw);
    add({ k, type, x, wy: base });
  }

  // ---------- Effekte ----------
  function splash(x, y, n, col, sp = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rnd(40, 170) * sp;
      G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rnd(0.35, 0.75), max: 0.75, r: rnd(1.8, 4.2), c: col || '#ffffff', grav: 260, scroll: 1 });
    }
  }
  function sparkle(x, y, n, col) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rnd(30, 120);
      G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.8), max: 0.8, r: rnd(2, 4), c: col, star: true, grav: 0, scroll: 1 });
    }
  }
  function ring(x, y, max, a = 0.5, life = 0.9) { G.rings.push({ x, y, r: max * 0.25, max, life, t: life, a }); }
  const floatT = (x, y, text, c, size = 20) => {
    for (const f of G.floats) if (f.life > 0.6 && Math.abs(f.x - x) < 110 && Math.abs(f.y - y) < f.size + 4) y = f.y - f.size - 6;
    G.floats.push({ x, y, text, c, size, life: 1.1 });
  };
  function banner(title, sub, col) { G.banner = { title, sub, col: col || '#ffffff', life: 2.8, t: 0 }; }

  // ---------- Treffer & Einsammeln ----------
  function hurt(o, fromX, fromY) {
    if (G.inv > 0 || state !== 'play') return false;
    const P = G.p, pwy = G.dist + P.py, px = sx(P.x, pwy), py = sy(pwy);
    let dx = (cxAt(pwy) + P.x) - fromX, dy = pwy - fromY;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    P.ex += dx * 5; P.ey += dy * 4;
    if (G.shield > 0) {
      G.shield = 0; G.inv = 1.1; sfx.shield();
      splash(px, py, 18, '#9be27a', 1.1); ring(px, py, 1.6 * U, 0.8);
      floatT(px, py - U, 'Schild!', '#bff3a0', 22);
      return true;
    }
    G.lives--; G.inv = DIFFS[DIFF].inv; G.shake = 0.35; G.flash = 0.35; G.combo = 0; G.comboT = 0;
    sfx.hurt(); splash(px, py, 22, '#ffffff', 1.2); ring(px, py, 1.5 * U, 0.7);
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    if (G.lives <= 0) {
      G.lives = 0; state = 'dying'; G.dieT = 0; musicStop(); sfx.over();
    } else {
      floatT(px, py - U * 0.9, pick(['Autsch!', 'Aua!', 'Hoppla!']), '#ffffff', 24);
    }
    return true;
  }
  function collect(o) {
    const pwy = o.wy, px = sx(o.x, pwy), py = sy(pwy);
    if (o.k === 'fruit') {
      G.combo = G.comboT > 0 ? Math.min(G.combo + 1, 12) : 1; G.comboT = 2.4;
      G.bestCombo = Math.max(G.bestCombo, G.combo);
      const mult = Math.min(5, 1 + Math.floor((G.combo - 1) / 2)) * (G.rapid && G.rapid.warn <= 0 ? 2 : 1);
      const pts = (o.gold ? 50 : 10) * mult;
      G.bonus += pts; G.fruits++; G.eat = 0.8; G.eatGold = !!o.gold;
      if (o.gold) { sfx.gold(); sparkle(px, py, 16, '#ffe066'); } else sfx.pick(G.combo);
      sparkle(px, py, 6, '#ffb347'); ring(px, py, 0.9 * U, 0.6, 0.5);
      floatT(px, py - 10, '+' + pts + (mult > 1 ? '  ×' + mult : ''), o.gold ? '#fff08a' : '#ffffff', o.gold ? 24 : 19);
    } else if (o.k === 'heart') {
      if (G.lives < G.maxLives) { G.lives++; floatT(px, py - 10, '+1 Herz', '#ff9aa6', 22); }
      else { G.bonus += 50; floatT(px, py - 10, '+50', '#ff9aa6', 22); }
      sfx.heart(); sparkle(px, py, 14, '#ff6b7a');
    } else if (o.k === 'pw') {
      sfx.power(); sparkle(px, py, 18, '#bff3ff'); ring(px, py, 1.4 * U, 0.8);
      if (o.type === 'shield') { G.shield = 12; floatT(px, py - 10, 'Seerosen-Schild!', '#bff3a0', 22); }
      if (o.type === 'magnet') { G.magnet = 9; floatT(px, py - 10, 'Orangen-Magnet!', '#ffb3b3', 22); }
      if (o.type === 'slow') { G.slow = 6; floatT(px, py - 10, 'Zeitlupe!', '#c9d8ff', 22); }
    }
    o.dead = true;
  }

  // ---------- Update ----------
  const keys = { l: false, r: false, u: false, d: false };
  let drag = null;

  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
    const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }

  function update(rdt) {
    T += rdt;
    if (state === 'over') { tickFx(rdt, 0); return; }
    const D = DIFFS[DIFF], P = G.p, playing = state === 'play', dying = state === 'dying';
    let wdt = rdt * (G.slow > 0 ? 0.55 : 1);
    if (dying) { G.dieT += rdt; wdt *= Math.max(0, 1 - G.dieT / 1.1); if (G.dieT > 1.5) { gameOver(); return; } }
    G.t += wdt;
    const lv = G.dist / SECLEN;

    // Tempo
    let target = G.demo ? 1.6 : 3.0 * D.speed * (1 + Math.min(0.55, lv * 0.065));
    if (G.rapid && G.rapid.warn <= 0) target *= 1.5;
    G.speed = lerp(G.speed, target, Math.min(1, rdt * (G.speed < target ? 0.9 : 2)));
    const step = G.speed * wdt;
    G.dist += step; G.wflow += step * 0.3;
    if (playing) G.distPts += step * (G.rapid && G.rapid.warn <= 0 ? 2 : 1);

    // Abschnitte
    if (!G.demo) {
      const s = Math.floor(G.dist / SECLEN);
      if (s !== G.sec) {
        G.sec = s; const si = s % 5, round = Math.floor(s / 5) + 1;
        G.palFrom = G.palTo; G.palTo = si; G.palT = 0;
        G.bonus += 100; sfx.section();
        banner('Abschnitt ' + (s + 1), SECTIONS[si].n + (round > 1 ? ' · Runde ' + round : ''), '#fff3b0');
        floatT(W / 2, H * 0.28 + 64, '+100 Bonus', '#fff3b0', 20);
        if (SECTIONS[si].rapids) G.nextRapid = G.dist + 14;
        else if (s >= 2) G.nextRapid = G.dist + SECLEN * rnd(0.4, 0.6);
        else G.nextRapid = Infinity;
      }
      if (!G.rapid && G.dist >= G.nextRapid) {
        G.rapid = { warn: 1.8, t: 7 }; sfx.rapid();
        banner('Stromschnellen!', 'Schnell – aber Punkte ×2', '#bff3ff');
        G.nextRapid = Infinity;
      }
      if (G.rapid) {
        if (G.rapid.warn > 0) G.rapid.warn -= wdt; else G.rapid.t -= wdt;
        if (G.rapid.t <= 0) {
          G.rapid = null;
          if (SECTIONS[G.sec % 5].rapids) G.nextRapid = G.dist + rnd(35, 55);
        }
      }
      if (playing) {
        if (G.dist >= G.nextRow) spawnRow();
        if (G.dist >= G.nextFruit) spawnFruit();
        if (G.dist >= G.nextHeart) {
          if (G.lives < G.maxLives) { spawnItem('heart'); G.nextHeart = G.dist + rnd(55, 85) * D.heart; }
          else G.nextHeart = G.dist + 20;
        }
        if (G.dist >= G.nextPw) {
          const types = { shield: 1, magnet: 1 }; if (G.sec >= 1) types.slow = 0.8;
          spawnItem('pw', wpick(types)); G.nextPw = G.dist + rnd(55, 85) * D.pw;
        }
      }
    }
    if (G.palT < 1) G.palT = Math.min(1, G.palT + rdt / 3);
    fillDeco();

    // Spieler
    const pwy = G.dist + P.py, hw = hwAt(pwy) - 0.48;
    if (playing) {
      const maxV = 6.4;
      if (drag && drag.tx != null) {
        const dvx = clamp((drag.tx - P.x) * 14, -12, 12), dvy = clamp((drag.ty - P.py) * 14, -12, 12);
        P.vx = lerp(P.vx, dvx, Math.min(1, rdt * 18)); P.vy = lerp(P.vy, dvy, Math.min(1, rdt * 18));
      } else {
        let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = (keys.u ? 1 : 0) - (keys.d ? 1 : 0);
        if (ix && iy) { ix *= 0.7071; iy *= 0.7071; }
        P.vx = lerp(P.vx, ix * maxV, Math.min(1, rdt * (ix ? 9 : 6)));
        P.vy = lerp(P.vy, iy * maxV * 0.8, Math.min(1, rdt * (iy ? 9 : 6)));
      }
    } else if (G.demo) {
      const tx = Math.sin(T * 0.5) * 1.6, ty = Math.min(4, pyMax()) + Math.sin(T * 0.7) * 0.4;
      P.vx = (tx - P.x) * 2; P.vy = (ty - P.py) * 2;
    } else { P.vx *= 0.9; P.vy *= 0.9; }
    if (G.rapid && G.rapid.warn <= 0 && playing) P.ex += Math.sin(T * 1.7) * Math.cos(T * 0.9 + 1) * 6 * rdt;
    const damp = Math.exp(-rdt * 3.2); P.ex *= damp; P.ey *= damp;
    P.x += (P.vx + P.ex) * rdt; P.py += (P.vy + P.ey) * rdt;
    if (P.x < -hw) { P.x = -hw; if (P.ex < 0) P.ex = 0; }
    if (P.x > hw) { P.x = hw; if (P.ex > 0) P.ex = 0; }
    P.py = clamp(P.py, 1.3, pyMax());
    if (drag && drag.tx != null) { drag.tx = clamp(drag.tx, -hw, hw); drag.ty = clamp(drag.ty, 1.3, pyMax()); }
    P.rot = lerp(P.rot, clamp(P.vx * 0.055, -0.35, 0.35), Math.min(1, rdt * 8));
    P.paddle += rdt * (4 + Math.hypot(P.vx, P.vy) * 1.3);
    const ppx = sx(P.x, G.dist + P.py), ppy = sy(G.dist + P.py);
    G.wakeT -= rdt;
    if (G.wakeT <= 0 && !dying) {
      const mv = Math.hypot(P.vx, P.vy);
      ring(ppx, ppy + 0.45 * U, U * (0.7 + mv * 0.06), 0.35, 1.0);
      G.wakeT = mv > 2 ? 0.14 : 0.3;
      if (mv > 4 && Math.random() < 0.5) splash(ppx + rnd(-0.3, 0.3) * U, ppy + 0.3 * U, 2, 'rgba(255,255,255,.9)', 0.5);
    }
    if (dying && Math.random() < 0.4) G.parts.push({ x: ppx + rnd(-0.3, 0.3) * U, y: ppy, vx: rnd(-10, 10), vy: rnd(-60, -30), life: 0.8, max: 0.8, r: rnd(2, 5), c: 'rgba(255,255,255,.8)', bubble: true, grav: 0, scroll: 0 });

    // Timer
    if (playing) {
      G.inv = Math.max(0, G.inv - rdt); G.shield = Math.max(0, G.shield - rdt);
      G.magnet = Math.max(0, G.magnet - rdt); G.slow = Math.max(0, G.slow - rdt);
      G.comboT = Math.max(0, G.comboT - rdt); if (G.comboT <= 0) G.combo = 0;
      G.hintT = Math.max(0, G.hintT - rdt);
    }

    // Objekte
    const pax = cxAt(pwy) + P.x;
    let pulledNow = false;
    for (const o of G.obs) {
      o.age += wdt;
      if (o.k === 'pir') {
        if (o.beh === 'straight') o.vx = Math.sin(o.age * 3 + o.ph) * 0.6;
        else if (o.beh === 'zig') o.vx = Math.sin(o.age * 2.2 + o.ph) * 2;
        else if (o.beh === 'hunt') {
          if (o.wy - pwy > 2.6) o.vx = lerp(o.vx, clamp((pax - (cxAt(o.wy) + o.x)) * 1.2, -2.2, 2.2), Math.min(1, wdt * 2.5));
          else o.vx *= Math.exp(-wdt * 2);
        } else if (o.beh === 'cross') {
          const ohw = hwAt(o.wy) - 0.3;
          if (Math.abs(o.x) > ohw && Math.sign(o.x) === Math.sign(o.vx) && o.age > 1) { o.beh = 'straight'; o.vy = -1.1; }
        }
        o.x += o.vx * wdt; o.wy += o.vy * wdt;
        const ohw = hwAt(o.wy) - 0.3;
        if (o.beh !== 'cross') o.x = clamp(o.x, -ohw, ohw);
      } else if (o.k === 'log') {
        o.wy += G.speed * o.flow * wdt; o.a += o.spin * wdt;
      } else if (o.k === 'croc') {
        o.wy += G.speed * 0.12 * wdt;
        const dy = o.wy - pwy;
        if (dy < 6.5 && dy > -1) o.vx = lerp(o.vx, clamp((pax - (cxAt(o.wy) + o.x)) * 0.9, -1.1, 1.1) * (DIFF === 0 ? 0.6 : 1), Math.min(1, wdt * 2));
        else o.vx *= Math.exp(-wdt * 2);
        o.x = clamp(o.x + o.vx * wdt, -(hwAt(o.wy) - 0.35), hwAt(o.wy) - 0.35);
        o.r = lerp(o.r, -o.vx * 0.18, Math.min(1, wdt * 4));
        const near = Math.hypot((cxAt(o.wy) + o.x) - pax, (o.wy - 1) - pwy) < 2.3;
        o.jaw = lerp(o.jaw, near ? 1 : 0.1 + 0.1 * Math.sin(o.age * 2), Math.min(1, wdt * 6));
        if (near && !o.snapped && playing) { o.snapped = true; sfx.snap(); }
      } else if (o.k === 'fruit' || o.k === 'heart' || o.k === 'pw') {
        o.wy += G.speed * 0.15 * wdt;
      }
      if (o.k === 'fruit' && G.magnet > 0 && playing) {
        const ax = cxAt(o.wy) + o.x, dx = pax - ax, dy = pwy - o.wy, d = Math.hypot(dx, dy);
        if (d < 4.4 && d > 0.01) { const s = Math.min(d, 8 * rdt); o.x += dx / d * s; o.wy += dy / d * s; }
      }

      if (!playing || o.dead) continue;
      const oax = cxAt(o.wy) + o.x, dx = oax - pax, dy = o.wy - pwy;
      if (Math.abs(dy) > 3.5 || Math.abs(dx) > 4) {
        if (o.k !== 'pool' || Math.abs(dy) > 3) continue;
      }
      const d = Math.hypot(dx, dy);
      if (o.k === 'rock') { if (d < o.r * 0.8 + 0.32) hurt(o, oax, o.wy); }
      else if (o.k === 'pir') { if (d < 0.26 + 0.32) hurt(o, oax, o.wy); }
      else if (o.k === 'log') {
        const c = Math.cos(o.a) * o.len, s = -Math.sin(o.a) * o.len;

      if (y > top - 4 || y < -5 * U) continue;
      const x = clamp(sx(o.x, o.wy), 20, W - 20), a = 0.55 + 0.45 * Math.sin(T * 12);
      g.globalAlpha = a; g.fillStyle = o.beh === 'hunt' ? '#ff3b5c' : o.k === 'croc' ? '#4caf50' : '#ff7a3b';
      g.beginPath(); g.moveTo(x, top + 26); g.lineTo(x - 13, top + 4); g.lineTo(x + 13, top + 4); g.closePath(); g.fill();
      g.fillStyle = '#fff'; g.font = '700 15px ' + FONT; g.fillText('!', x, top + 12); g.globalAlpha = 1;
    }
    // Power-up-Anzeigen
    let px = 14 + 22;
    const items = [], showPw = state === 'play' || state === 'pause';
    if (G.shield > 0) items.push(['shield', G.shield / 12]);
    if (G.magnet > 0) items.push(['magnet', G.magnet / 9]);
    if (G.slow > 0) items.push(['slow', G.slow / 6]);
    for (const [type, f] of (showPw ? items : [])) {
      const cy = top + 40;
      g.fillStyle = 'rgba(255,255,255,.85)'; circ(px, cy, 22); g.fill();
      drawPwIcon(type, px, cy, 15);
      g.strokeStyle = type === 'shield' ? '#4fa843' : type === 'magnet' ? '#e53935' : '#f4a340'; g.lineWidth = 4; g.lineCap = 'round';
      g.beginPath(); g.arc(px, cy, 22, -Math.PI / 2, -Math.PI / 2 + TAU * f); g.stroke();
      px += 52;
    }
    // Combo
    if (G.combo >= 2 && state === 'play') {
      const mult = Math.min(5, 1 + Math.floor((G.combo - 1) / 2)), pulse = 1 + Math.max(0, G.comboT - 2) * 0.6;
      const txt = 'Combo ' + G.combo + (mult > 1 ? '  ×' + mult : '');
      g.font = '700 22px ' + FONT;
      const tw = Math.max(110, g.measureText(txt).width);
      g.save(); g.translate(W - 16 - tw / 2, top + 40); g.scale(pulse, pulse);
      g.lineWidth = 5; g.strokeStyle = 'rgba(120,50,0,.55)'; g.strokeText(txt, 0, 0);
      g.fillStyle = '#ffd24a'; g.fillText(txt, 0, 0);
      g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(-tw / 2, 16, tw, 5);
      g.fillStyle = '#ffd24a'; g.fillRect(-tw / 2, 16, tw * (G.comboT / 2.4), 5);
      g.restore();
    }
    // Schwebende Texte
    for (const f of G.floats) {
      g.globalAlpha = clamp(f.life * 1.6, 0, 1); g.font = '700 ' + f.size + 'px ' + FONT;
      const x = clamp(f.x, 70, W - 70);
      g.lineWidth = 4; g.strokeStyle = 'rgba(10,40,60,.55)'; g.strokeText(f.text, x, f.y); g.fillStyle = f.c; g.fillText(f.text, x, f.y);
    }
    g.globalAlpha = 1;
    // Banner
    if (G.banner) {
      const b = G.banner, a = Math.min(1, b.t * 4, b.life * 1.5), yy = H * 0.28 - (1 - Math.min(1, b.t * 4)) * 20;
      g.globalAlpha = a;
      const fs = Math.min(40, W / 10);
      g.font = '700 ' + fs + 'px ' + FONT; g.lineWidth = 7; g.strokeStyle = 'rgba(10,40,60,.55)';
      g.strokeText(b.title, W / 2, yy); g.fillStyle = b.col; g.fillText(b.title, W / 2, yy);
      if (b.sub) { g.font = '600 ' + Math.round(fs * 0.55) + 'px ' + FONT; g.lineWidth = 5; g.strokeText(b.sub, W / 2, yy + fs * 0.85); g.fillStyle = '#fff'; g.fillText(b.sub, W / 2, yy + fs * 0.85); }
      g.globalAlpha = 1;
    }
    // Hinweis am Anfang
    if (state === 'play' && G.hintT > 0) {
      const a = Math.min(1, G.hintT);
      g.globalAlpha = a; g.font = '600 ' + Math.min(18, W / 22) + 'px ' + FONT;
      const txt = touchUsed ? 'Zieh mit dem Finger, um Capy zu lenken' : 'Pfeiltasten oder WASD – oder mit der Maus ziehen';
      const tw = g.measureText(txt).width + 28, yb = H - 34;
      g.fillStyle = 'rgba(10,40,60,.55)'; rr(W / 2 - tw / 2, yb - 18, tw, 36, 18); g.fill();
      g.fillStyle = '#fff'; g.fillText(txt, W / 2, yb + 1); g.globalAlpha = 1;
    }
  }

  function draw() {
    g = ctx;
    const pal = palette();
    ctx.save();
    if (G.shake > 0) ctx.translate(rnd(-1, 1) * 14 * G.shake, rnd(-1, 1) * 14 * G.shake);
    drawScene(pal);
    drawObjects();
    drawPlayer();
    drawFx();
    drawCanopy();
    if (G.slow > 0 && state === 'play') {
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(120,150,255,0)'); vg.addColorStop(1, 'rgba(120,150,255,.28)');
      ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (G.rapid && G.rapid.warn <= 0 && state === 'play') {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + 0.03 * Math.sin(T * 10)) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    ctx.restore();
    drawOverlayUI();
    if (G.flash > 0) { ctx.fillStyle = 'rgba(255,70,70,' + (G.flash * 0.7) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- HUD ----------
  let hudKey = '';
  function hud() {
    const key = G.score + '|' + G.lives + '|' + G.maxLives + '|' + Math.floor(G.dist);
    if (key === hudKey) return; hudKey = key;
    $('score').textContent = G.score.toLocaleString('de-DE');
    $('dist').textContent = Math.floor(G.dist).toLocaleString('de-DE') + ' m';
    let h = '';
    for (let i = 0; i < G.maxLives; i++) h += i < G.lives ? '<span>♥</span>' : '<span class="off">♥</span>';
    const L = $('lives'); L.innerHTML = h; L.setAttribute('aria-label', G.lives + ' von ' + G.maxLives + ' Leben');
  }

  // ---------- Karten ----------
  const bestGet = d => parseInt(store.get('best-' + d, '0'), 10) || 0;
  let lastRecord = false;
  function show(html, wide) { $('card').classList.toggle('wide', !!wide); $('card').scrollTop = 0; $('card').innerHTML = html; $('ov').classList.remove('hidden'); }
  function hideCard() { $('ov').classList.add('hidden'); }
  function diffButtons() {
    return '<div class="diffs" role="group" aria-label="Schwierigkeit">' + DIFFS.map((d, i) =>
      '<button class="diff" data-d="' + i + '" aria-pressed="' + (i === DIFF) + '">' + d.n + '</button>').join('') + '</div>' +
      '<p id="diffdesc" class="muted small">' + DIFFS[DIFF].d + ' · Bestwert: ' + bestGet(DIFF).toLocaleString('de-DE') + '</p>';
  }
  function wireDiffs() {
    document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => {
      DIFF = +b.dataset.d; store.set('diff', DIFF); audioInit(); sfx.click();
      document.querySelectorAll('.diff').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.d === DIFF)));
      $('diffdesc').textContent = DIFFS[DIFF].d + ' · Bestwert: ' + bestGet(DIFF).toLocaleString('de-DE');
    }));
  }
  function logoCanvas(id, w, h) { return '<canvas id="' + id + '" width="' + w + '" height="' + h + '" style="width:' + w + 'px;height:' + h + 'px"></canvas>'; }
  function paintLogo(id) {
    const c = $(id); if (!c) return;
    const w = parseFloat(c.style.width), h = parseFloat(c.style.height), d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = w * d; c.height = h * d;
    const x2 = c.getContext('2d'); x2.setTransform(d, 0, 0, d, 0, 0);
    const old = g; g = x2;
    const wg = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
    wg.addColorStop(0, '#6cc6ef'); wg.addColorStop(1, '#2f8fd0');
    g.fillStyle = wg; ell(w / 2, h * 0.58, w * 0.48, h * 0.4); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; ell(w / 2, h * 0.62, w * 0.3, h * 0.16); g.stroke();
    drawCapy(w / 2, h * 0.62, h * 0.62, { rot: 0.18, paddle: 1, eyes: 'happy' });
    g = old;
  }
  function paintIcons() {
    document.querySelectorAll('canvas.ico').forEach(c => {
      const d = Math.min(window.devicePixelRatio || 1, 2), sz = 44;
      c.width = sz * d; c.height = sz * d;
      const x2 = c.getContext('2d'); x2.setTransform(d, 0, 0, d, 0, 0);
      const old = g; g = x2;
      const k = c.dataset.k, m = sz / 2;
      g.fillStyle = '#5cb6e6'; circ(m, m, m - 1); g.fill();
      if (k === 'fruit') drawOrange(m, m + 3, 60, false);
      else if (k === 'gold') drawOrange(m, m + 3, 64, true);
      else if (k === 'heart') drawHeart(m, m + 2, 48);
      else if (k === 'shield' || k === 'magnet' || k === 'slow') drawBubble(m, m, 50, k);
      else if (k === 'pir') drawPir(m, m, 50, Math.PI / 2, { age: 0.3 });
      else if (k === 'hunt') drawPir(m, m, 50, Math.PI / 2, { age: 0.3, beh: 'hunt' });
      else if (k === 'log') drawLog(m, m, 24, { len: 1.3, a: -0.35 });
      else if (k === 'rock') drawRock(m, m, 34, { r: 0.55, v: [1, 0.9, 1.05, 0.95, 1.1, 0.9, 1, 1.05, 0.92], moss: 0.8 });
      else if (k === 'pool') drawPool(m, m, 16, { ph: 0 });
      else if (k === 'croc') { g.save(); g.translate(m, m); g.rotate(-0.9); drawCroc(0, 0, 17, { jaw: 0.8, age: 0 }); g.restore(); }
      else if (k === 'rapid') { g.strokeStyle = '#fff'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); for (let i = 0; i < 4; i++) { g.moveTo(10 + i * 8, 8 + (i % 2) * 6); g.lineTo(10 + i * 8, 30 + (i % 2) * 6); } g.stroke(); }
      g = old;
    });
  }
  function showStart() {
    state = 'menu'; $('wrap').classList.add('menu');
    show('<div class="head">' + logoCanvas('logo', 92, 70) + '<div><h1>Capybara Fluss-Lauf</h1>' +
      '<p class="muted small" style="margin:0">Ein Abenteuer auf dem Fluss</p></div></div>' +
      '<p>Schwimm mit Capy den Fluss hinunter, sammle Orangen und weiche Piranhas, Baumstämmen und Krokodilen aus!</p>' +
      diffButtons() +
      '<button class="btn primary" id="go">Los geht’s!</button>' +
      '<button class="btn secondary" id="help">So geht’s</button>');
    paintLogo('logo'); wireDiffs();
    $('go').addEventListener('click', startGame);
    $('help').addEventListener('click', () => { sfx.click(); showHelp(); });
    setTimeout(() => { try { $('go').focus({ preventScroll: true }); } catch (e) {} }, 50);
  }
  function showHelp() {
    const it = (k, t, s) => '<div><canvas class="ico" data-k="' + k + '"></canvas><span>' + t + '<small>' + s + '</small></span></div>';
    show('<h1>So geht’s</h1>' +
      '<ul class="keys"><li><b>Handy/Tablet:</b> Finger irgendwo aufs Bild legen und ziehen – Capy folgt deiner Bewegung.</li>' +
      '<li><b>Tastatur:</b> Pfeiltasten oder W A S D. <b>P</b> = Pause, <b>M</b> = Ton an/aus.</li>' +
      '<li>Capy kann nach links, rechts und ein Stück nach vorne und zurück schwimmen.</li></ul>' +
      '<h2>Einsammeln</h2><div class="legend">' +
      it('fruit', 'Orange', '+10 Punkte, mehrere hintereinander = Combo') +
      it('gold', 'Goldorange', '+50 Punkte') +
      it('heart', 'Herz', 'ein Leben zurück') +
      it('shield', 'Seerosenblatt', 'schützt vor einem Treffer') +
      it('magnet', 'Magnet', 'zieht Orangen an') +
      it('slow', 'Schnecke', 'Zeitlupe für alles andere') + '</div>' +
      '<h2>Aufpassen</h2><div class="legend">' +
      it('pir', 'Piranha', 'schwimmt dir entgegen') +
      it('hunt', 'Jäger-Piranha', 'dunkelrot, zielt auf dich') +
      it('log', 'Baumstamm', 'treibt und dreht sich') +
      it('rock', 'Stein', 'bleibt, wo er ist') +
      it('pool', 'Strudel', 'zieht dich an – schnell weg!') +
      it('croc', 'Krokodil', 'schwimmt zu dir herüber') +
      it('rapid', 'Stromschnellen', 'schnell, aber Punkte ×2') + '</div>' +
      '<p class="muted small">Jeder Treffer kostet ein Herz. Danach blinkt Capy kurz und ist unverwundbar. Alle 200 m beginnt ein neuer Flussabschnitt.</p>' +
      '<div class="row2"><button class="btn secondary" id="back">Zurück</button><button class="btn primary" id="go">Los!</button></div>', true);
    paintIcons();
    $('go').addEventListener('click', startGame);
    $('back').addEventListener('click', () => { sfx.click(); showStart(); });
  }
  function showPause() {
    show('<h1>Pause</h1><p>Capy treibt gemütlich im Wasser und wartet auf dich.</p>' +
      '<p class="muted small">' + G.score.toLocaleString('de-DE') + ' Punkte · ' + Math.floor(G.dist) + ' m · ' + DIFFS[DIFF].n + '</p>' +
      '<button class="btn primary" id="resume">Weiter</button>' +
      '<div class="row2"><button class="btn secondary" id="restart">Neu starten</button><button class="btn secondary" id="menu">Menü</button></div>');
    $('resume').addEventListener('click', resume);
    $('restart').addEventListener('click', startGame);
    $('menu').addEventListener('click', toMenu);
    setTimeout(() => { try { $('resume').focus({ preventScroll: true }); } catch (e) {} }, 50);
  }
  function showOver() {
    const best = bestGet(DIFF);
    show((lastRecord ? '<span class="badge">Neuer Rekord!</span>' : '') +
      '<h1>' + (lastRecord ? 'Super gemacht!' : 'Oh nein, erwischt!') + '</h1>' +
      '<div class="big">' + G.score.toLocaleString('de-DE') + '</div><p class="muted">Punkte</p>' +
      '<div class="stats"><span>Strecke: <b>' + Math.floor(G.dist).toLocaleString('de-DE') + ' m</b></span>' +
      '<span>Orangen: <b>' + G.fruits + '</b></span>' +
      '<span>Beste Combo: <b>' + G.bestCombo + '</b></span>' +
      '<span>Abschnitt: <b>' + (G.sec + 1) + '</b></span></div>' +
      '<p class="muted small">Bestwert (' + DIFFS[DIFF].n + '): ' + best.toLocaleString('de-DE') + '</p>' +
      diffButtons() +
      '<button class="btn primary" id="go">Nochmal!</button><button class="btn secondary" id="menu">Menü</button>');
    wireDiffs();
    $('go').addEventListener('click', startGame);
    $('menu').addEventListener('click', toMenu);
    setTimeout(() => { try { $('go').focus({ preventScroll: true }); } catch (e) {} }, 60);
  }

  // ---------- Ablauf ----------
  function startGame() {
    audioInit(); resize(); newGame(false); state = 'play'; hudKey = ''; drag = null;
    $('wrap').classList.remove('menu'); hideCard();
    sfx.start(); musicStart();
    banner('Abschnitt 1', SECTIONS[0].n, '#fff3b0');
    try { cv.focus({ preventScroll: true }); } catch (e) {}
  }
  function pauseGame() {
    if (state !== 'play') return;
    state = 'pause'; drag = null; sfx.click(); showPause();
  }
  function resume() {
    if (state !== 'pause') return;
    state = 'play'; hideCard(); sfx.click(); last = performance.now();
    for (const k in keys) keys[k] = false;
  }
  function toMenu() { musicStop(); newGame(true); showStart(); }
  function gameOver() {
    state = 'over';
    const prev = bestGet(DIFF);
    lastRecord = G.score > prev && G.score > 0;
    if (lastRecord) store.set('best-' + DIFF, G.score);
    showOver();
  }

  // ---------- Eingabe ----------
  let touchUsed = false;
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') touchUsed = true;
    if (state !== 'play') return;
    e.preventDefault();
    drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY, tx: G.p.x, ty: G.p.py };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || state !== 'play') return;
    const k = e.pointerType === 'touch' ? 1.35 : 1.1;
    drag.tx += (e.clientX - drag.lx) / U * k; drag.ty -= (e.clientY - drag.ly) / U * k;
    drag.lx = e.clientX; drag.ly = e.clientY;
  });
  const endDrag = e => { if (drag && (!e || e.pointerId === drag.id)) drag = null; };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.card')) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());

  const KEYMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.key];
    if (k) { keys[k] = true; if (state === 'play') { e.preventDefault(); drag = null; } }
    if (e.key === ' ' && state === 'play') e.preventDefault();
    if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && !e.repeat) {
      if (state === 'play') pauseGame(); else if (state === 'pause') resume();
    }
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMute();
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat && (state === 'menu' || state === 'over')) {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault(); startGame();
    }
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (state === 'play') pauseGame(); if (A.ctx) { try { A.ctx.suspend(); } catch (e) {} } }
    else if (A.ctx) { try { A.ctx.resume(); } catch (e) {} }
  });
  function toggleMute() {
    audioInit(); A.muted = !A.muted; applyMute(); store.set('mute', A.muted ? '1' : '0');
  }
  $('mute').addEventListener('click', e => { e.stopPropagation(); toggleMute(); e.currentTarget.blur(); });
  $('pause').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); if (state === 'play') pauseGame(); else if (state === 'pause') resume(); });

  // ---------- Schleife ----------
  function frame(ts) {
    const rdt = Math.min(0.05, Math.max(0, (ts - last) / 1000) || 0); last = ts;
    try {
      if (state !== 'pause') update(rdt); else T += rdt * 0.3;
      draw(); hud();
    } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  }

  // Test-Schnittstelle (nur lesend/steuernd für automatische Tests)
  window.__fluss = { get state() { return state; }, get G() { return G; }, start: startGame, hurt: () => hurt(null, 0, -99) };

  resize(); newGame(true); applyMute(); showStart();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
