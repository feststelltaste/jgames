<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brief-Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf3e3; --wall: #fde6c4; --wall2: #f9d9a6; --panel: #ffffff; --fg: #2d2446; --muted: #7b6f92;
    --line: #ecdcc3; --accent: #ff7a3d; --accent2: #ffb13b; --accentfg: #ffffff; --good: #22c55e; --bad: #ef4444;
    --wood: #c0843f; --wood2: #8f5a26; --ph: #efe6d6; --phs: #b9aa92; --bubble: #ffffff; --tray: #fff9ef;
    --shadow: 0 6px 18px rgba(80, 50, 20, .14); --hud: #ffffffcc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17142b; --wall: #2a2548; --wall2: #221e3d; --panel: #262142; --fg: #f4efff; --muted: #aaa1c8;
      --line: #3b3462; --wood: #7c4f2a; --wood2: #57361b; --ph: #3a3460; --phs: #7a71a3; --bubble: #fbf8ff;
      --tray: #201c39; --shadow: 0 6px 18px rgba(0, 0, 0, .4); --hud: #1f1b37e6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17142b; --wall: #2a2548; --wall2: #221e3d; --panel: #262142; --fg: #f4efff; --muted: #aaa1c8;
    --line: #3b3462; --wood: #7c4f2a; --wood2: #57361b; --ph: #3a3460; --phs: #7a71a3; --bubble: #fbf8ff;
    --tray: #201c39; --shadow: 0 6px 18px rgba(0, 0, 0, .4); --hud: #1f1b37e6; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  .hidden { display: none !important; }

  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 1180px; margin: 0 auto;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

  /* ---------- HUD ---------- */
  #hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 6px; }
  #hud .hl, #hud .hr { display: flex; align-items: center; gap: 6px; }
  #hud .hc { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 24px; }
  .pill { background: var(--accent); color: var(--accentfg); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 17px; white-space: nowrap; }
  .combo { background: var(--accent2); color: #3b2300; border-radius: 10px; padding: 1px 8px; font-size: 17px; }
  .combo.pop { animation: pop .45s ease; }
  #hearts { display: flex; gap: 2px; }
  #hearts svg { width: 22px; height: 22px; }
  #hearts .lost { opacity: .22; filter: grayscale(1); }
  #hearts.hit { animation: shake .45s; }
  .ib { width: 42px; height: 42px; border: 0; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; }
  .ib svg { width: 22px; height: 22px; }
  #dayBar { display: flex; gap: 3px; padding: 0 12px 6px; height: 14px; }
  #dayBar i { flex: 1; border-radius: 4px; background: var(--line); transition: background .3s; }
  #dayBar i.ok { background: var(--good); } #dayBar i.bad { background: var(--bad); } #dayBar i.wait { background: var(--accent2); }

  /* ---------- Spielfläche ---------- */
  #play { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  #left, #right { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  #counter { position: relative; border-radius: 18px; overflow: hidden; min-height: 206px; flex-shrink: 0;
    background: repeating-linear-gradient(90deg, var(--wall) 0 26px, var(--wall2) 26px 52px); box-shadow: var(--shadow); }
  #counter::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px; z-index: 2;
    background: linear-gradient(var(--wood), var(--wood2)); border-top: 4px solid #e2a45f; }
  #sign { position: absolute; left: 10px; top: 8px; width: 74px; z-index: 0; opacity: .95; }
  #lamp { position: absolute; right: 12px; top: 0; width: 46px; z-index: 0; }
  #queue { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 100%; min-height: 206px; padding: 6px 6px 0; }
  #emptyTip { position: absolute; inset: 0 0 34px; display: grid; place-items: center; z-index: 1; color: var(--muted); font-size: 18px; pointer-events: none; }
  #banner { position: absolute; left: 50%; top: 40%; z-index: 5; transform: translate(-50%, -50%); font-size: 44px; font-weight: 700; color: #fff;
    background: var(--accent); padding: 4px 24px; border-radius: 18px; box-shadow: var(--shadow); pointer-events: none; white-space: nowrap; }
  #banner.show { animation: banner 1.6s ease forwards; }

  .cust { position: relative; width: clamp(98px, 31%, 150px); display: flex; flex-direction: column; align-items: center; cursor: pointer;
    border: 0; background: none; padding: 0; transition: transform .25s; animation: enter .55s cubic-bezier(.2, 1.4, .4, 1); }
  .cust .bubble { position: relative; width: 100%; background: var(--bubble); border-radius: 14px; padding: 5px 5px 3px; border: 3px solid transparent;
    box-shadow: 0 3px 10px rgba(0,0,0,.15); transition: border-color .2s, transform .2s; }
  .cust .bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: var(--bubble); }
  .cust.active .bubble { border-color: var(--accent); transform: scale(1.04); }
  .cust .bubble svg { width: 100%; height: auto; }
  .cust .dest { position: absolute; left: -6px; bottom: -8px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid var(--accent2);
    display: grid; place-items: center; font-weight: 700; font-size: 19px; color: #2d2446; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .cust .dest svg { width: 24px; height: 24px; }
  .cust .animal { width: 86px; margin-top: 8px; position: relative; z-index: 1; }
  .cust .animal svg { width: 100%; height: auto; }
  .cust .pbar { position: absolute; bottom: 10px; left: 12%; right: 12%; height: 11px; border-radius: 6px; background: rgba(0,0,0,.35); z-index: 3; overflow: hidden; }
  .cust .pbar i { display: block; height: 100%; width: 100%; border-radius: 6px; background: var(--good); }
  .cust.active .animal::before { content: ""; position: absolute; left: 50%; top: -2px; width: 0; height: 0; }
  .cust .arrow { position: absolute; top: -18px; left: 50%; margin-left: -9px; width: 18px; height: 14px; z-index: 4; display: none; animation: bob .8s ease-in-out infinite alternate; }
  .cust.active .arrow { display: block; }
  .cust.nope .bubble { animation: shake .45s; }
  .cust.leave-happy { animation: leaveHappy .8s ease-in forwards; pointer-events: none; }
  .cust.leave-angry { animation: leaveAngry .9s ease-in forwards; pointer-events: none; }
  .steam { position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; opacity: 0; z-index: 2; }
  .cust.mad .steam { animation: steam 1s ease-out infinite; }
  .cust.mad .steam.s2 { animation-delay: .5s; }

  #bench { position: relative; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }
  #bench.nope { animation: shake .45s; }
  #letterWrap { position: relative; width: clamp(150px, calc((100dvh - 600px) * 1.43), 230px); max-width: calc(100% - 96px); aspect-ratio: 200 / 140; }
  #letterWrap > svg { width: 100%; height: 100%; }
  #letterWrap.pop { animation: pop .3s ease; }
  #marks { position: absolute; inset: 0; pointer-events: none; }
  .xmark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center;
    font-size: 20px; font-weight: 700; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); animation: pop .35s ease; }
  .qmark { background: var(--accent2); color: #3b2300; }
  .postmark { position: absolute; width: 38%; pointer-events: none; animation: stampIn .22s ease-out forwards; }
  #clearBtn { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; color: var(--muted); }
  #clearBtn svg { width: 20px; height: 20px; }

  #trays { display: flex; flex-direction: column; gap: 6px; }
  .tray { background: var(--tray); border: 2px solid var(--line); border-radius: 16px; padding: 5px 6px 6px; transition: border-color .2s; }
  .tray h3 { margin: 0 0 3px 4px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .3px; }
  .tray .opts { display: flex; gap: 6px; justify-content: center; }
  .tray.bad { border-color: var(--bad); animation: shake .45s; }
  .tray.need { border-color: var(--accent2); animation: pulse .9s ease 2; }
  .opt { flex: 1 1 0; min-width: 0; max-width: 92px; height: 58px; border-radius: 12px; border: 3px solid transparent; background: var(--panel);
    box-shadow: 0 2px 5px rgba(0,0,0,.1); display: grid; place-items: center; padding: 3px; position: relative; transition: transform .15s, border-color .15s; }
  .opt svg { width: 100%; height: 100%; max-height: 46px; }
  .opt:active { transform: scale(.94); }
  .opt.sel { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 5px 12px rgba(255,122,61,.35); }
  .opt.sel::after { content: "✓"; position: absolute; right: -7px; top: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; }
  .opt.wrong { border-color: var(--bad); }
  .opt.wrong::after { content: "✗"; background: var(--bad); }
  .opt.hint { animation: hint .8s ease-in-out infinite alternate; border-color: var(--good); }

  #targets { display: flex; gap: 8px; }
  .target { flex: 1; min-height: 76px; border-radius: 16px; border: 3px solid transparent; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px; position: relative; transition: transform .15s; }
  .target:active { transform: scale(.96); }
  .target.mail { background: linear-gradient(#ffcf4a, #f5a623); color: #3b2300; font-size: 22px; font-weight: 700; }
  .target.mail svg { width: 58px; height: 58px; }
  .target.bin { flex-direction: column; gap: 2px; color: #2d2446; font-weight: 700; font-size: 20px; border-color: rgba(0,0,0,.08); }
  .target.bin svg { width: 44px; height: 44px; }
  .target.bin .num { position: absolute; left: 6px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #2d2446; color: #fff; font-size: 16px; display: grid; place-items: center; }
  .target.bad { border-color: var(--bad); animation: shake .45s; }
  .target.hint { border-color: var(--good); animation: hint .8s ease-in-out infinite alternate; }
  .target.gulp { animation: gulp .4s ease; }

  .flyer { position: fixed; z-index: 40; pointer-events: none; }
  .flyer svg { width: 100%; height: 100%; }
  .float { position: fixed; z-index: 45; pointer-events: none; font-weight: 700; font-size: 28px; color: var(--accent); text-shadow: 0 2px 0 #fff, 0 0 8px rgba(255,255,255,.8); animation: floatUp 1.2s ease-out forwards; white-space: nowrap; transform: translateX(-50%); }
  .float.big { font-size: 34px; color: #d946ef; }
  .float.heart { color: #ef4444; font-size: 26px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 44; }

  /* ---------- Overlay / Karten ---------- */
  #ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(30, 18, 50, .5); }
  .card { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); color: var(--fg); border-radius: 22px; padding: 20px 18px 18px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); animation: cardIn .3s ease; }
  .card h1 { font-size: 40px; line-height: 1; margin: 6px 0 8px; }
  .card h2 { font-size: 26px; margin: 4px 0 8px; }
  .card p { font-size: 18px; line-height: 1.35; margin: 0 0 12px; }
  .card .muted { color: var(--muted); font-size: 16px; }
  .hero { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 120px; margin-bottom: 2px; }
  .hero .h-animal { width: 104px; } .hero .h-letter { width: 96px; margin-bottom: 30px; animation: bob 1.2s ease-in-out infinite alternate; } .hero .h-mail { width: 80px; }
  .hero svg { width: 100%; height: auto; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 22px; font-weight: 600; background: var(--accent); color: var(--accentfg); box-shadow: 0 4px 0 #c9541f; margin-top: 8px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9541f; }
  .btn.alt { background: transparent; color: var(--fg); border: 2px solid var(--line); box-shadow: none; font-size: 18px; padding: 10px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 6px; }
  .diff { border: 3px solid var(--line); background: transparent; border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .diff b { font-size: 18px; font-weight: 600; } .diff small { font-size: 13px; color: var(--muted); line-height: 1.15; }
  .diff .ico { font-size: 26px; line-height: 1; }
  .diff[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,122,61,.12); }
  .best { font-size: 16px; color: var(--muted); margin: 6px 0 0; }
  .back { display: inline-block; margin-top: 12px; color: var(--muted); font-size: 16px; text-decoration: none; }
  .steps { display: grid; gap: 10px; text-align: left; margin: 6px 0 10px; }
  .step { display: flex; align-items: center; gap: 12px; }
  .step .pic { flex: 0 0 96px; display: flex; justify-content: center; }
  .step .pic svg { width: 100%; height: auto; max-height: 64px; }
  .step p { margin: 0; font-size: 17px; }
  .step .num { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .keys { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
  kbd { border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-family: inherit; }
  .news { display: grid; gap: 10px; margin: 8px 0 12px; }
  .new { display: flex; align-items: center; gap: 10px; background: var(--tray); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; text-align: left; }
  .new .pics { display: flex; gap: 4px; flex: 0 0 auto; }
  .new .pics svg { width: 38px; height: 38px; }
  .new p { margin: 0; font-size: 17px; }
  .new .tag { display: inline-block; background: var(--accent2); color: #3b2300; font-size: 13px; font-weight: 700; padding: 0 6px; border-radius: 6px; margin-right: 4px; }
  .goal { font-size: 18px; margin: 4px 0 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .goal svg { width: 36px; height: 36px; }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 6px 0 10px; }
  .stars svg { width: 64px; height: 64px; opacity: 0; transform: scale(.3); }
  .stars svg.on { animation: starIn .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat { background: var(--tray); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 18px; font-weight: 600; min-width: 76px; }
  .stat small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .big { font-size: 56px; font-weight: 700; line-height: 1; color: var(--accent); margin: 4px 0; }
  .record { display: inline-block; background: #d946ef; color: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 600; margin-bottom: 8px; animation: pop .5s ease; }

  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,177,59,0); } 50% { box-shadow: 0 0 0 6px rgba(255,177,59,.45); } }
  @keyframes hint { from { box-shadow: 0 0 0 0 rgba(34,197,94,.2); transform: scale(1); } to { box-shadow: 0 0 0 6px rgba(34,197,94,.5); transform: scale(1.06); } }
  @keyframes enter { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes leaveHappy { 0% { transform: none; } 25% { transform: translateY(-14px); } 100% { transform: translate(-60px, 10px); opacity: 0; } }
  @keyframes leaveAngry { 0% { transform: none; } 15% { transform: translateX(-6px); } 30% { transform: translateX(6px); } 100% { transform: translate(160px, 30px) rotate(8deg); opacity: 0; } }
  @keyframes steam { 0% { opacity: .9; transform: translate(0, 0) scale(.6); } 100% { opacity: 0; transform: translate(0, -26px) scale(1.4); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
  @keyframes stampIn { 0% { opacity: 0; transform: scale(2.4) rotate(-30deg); } 100% { opacity: .9; transform: scale(1) rotate(-12deg); } }
  @keyframes gulp { 0% { transform: scale(1); } 40% { transform: scale(1.1, .9); } 70% { transform: scale(.96, 1.05); } 100% { transform: scale(1); } }
  @keyframes cardIn { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes starIn { from { opacity: 0; transform: scale(.3) rotate(-40deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

  /* kleine Handys */
  @media (max-width: 400px) {
    #play { padding: 0 8px 10px; }
    .tray { padding: 4px 4px 5px; }
    .tray .opts { gap: 5px; }
    .opt { height: 54px; }
    #hud { padding: 6px 8px 4px; }
    #hud .hc { font-size: 20px; gap: 4px; min-width: 0; }
    #starIco { display: none; }
    #hearts svg { width: 18px; height: 18px; }
    .combo { font-size: 15px; padding: 1px 6px; }
    #hud .hr { gap: 4px; }
    .pill { font-size: 15px; padding: 3px 10px; }
    .ib { width: 40px; height: 40px; }
    #dayBar { padding: 0 8px 6px; }
  }
  @media (max-height: 760px) and (max-width: 899px) {
    .tray h3 { display: none; }
    #counter, #queue { min-height: 172px; }
    #counter::after { height: 30px; }
    .cust .animal { width: 70px; }
    .opt { height: 50px; }
    .opt svg { max-height: 40px; }
    .target { min-height: 62px; }
    .target.mail svg { width: 46px; height: 46px; }
    .target.bin svg { width: 36px; height: 36px; }
    #play, #left, #right { gap: 6px; }
  }
  /* Desktop: zwei Spalten */
  @media (min-width: 900px) {
    #play { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; padding: 4px 16px 16px; align-content: safe center; }
    #left, #right { gap: 14px; }
    #counter, #queue { min-height: 320px; }
    .cust { width: clamp(120px, 30%, 170px); }
    .cust .animal { width: 118px; }
    .cust .dest { width: 40px; height: 40px; } .cust .dest svg { width: 28px; height: 28px; }
    #bench { min-height: 250px; }
    #letterWrap { width: min(100% - 100px, 340px); max-width: none; }
    .opt { height: 72px; }
    .opt svg { max-height: 58px; }
    .target { min-height: 100px; }
    #sign { width: 96px; } #lamp { width: 58px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hl"><span id="day" class="pill">Tag 1</span></div>
    <div class="hc"><span id="starIco"></span><span id="score">0</span><span id="combo" class="combo hidden">×2</span></div>
    <div class="hr"><span id="hearts"></span><button id="mute" class="ib" aria-label="Ton aus"></button><button id="pauseBtn" class="ib" aria-label="Pause"></button></div>
  </header>
  <div id="dayBar"></div>
  <main id="play">
    <div id="left">
      <section id="counter" aria-label="Schalter">

    const wrongBin = S.cfg.dests && bin !== c.order.dest;
    if (wrong.length || wrongBin) {
      S.mistakes++; S.streak = 0; S.mult = 1;
      if (S.diff !== 0) c.p = Math.max(0.02, c.p - (S.diff === 2 ? 0.2 : 0.12));
      wrong.forEach(k => {
        const t = document.querySelector('.tray[data-k="' + k + '"]');
        if (t) {
          t.classList.add('bad');
          const selB = t.querySelector('.opt[data-v="' + S.sel[k] + '"]'); if (selB) selB.classList.add('wrong');
          if (S.diff === 0) { const ok = t.querySelector('.opt[data-v="' + c.order[k] + '"]'); if (ok) ok.classList.add('hint'); }
        }
        addMark(k, '✗');
      });
      if (wrongBin) {
        const tb = document.querySelector('.target.bin[data-v="' + bin + '"]'); if (tb) tb.classList.add('bad');
        if (S.diff === 0) { const ok = document.querySelector('.target.bin[data-v="' + c.order.dest + '"]'); if (ok) ok.classList.add('hint'); }
      }
      c.flashT = 1.2; setMood(c, S.diff === 0 ? 'ok' : 'angry');
      c.el.classList.remove('nope'); void c.el.offsetWidth; c.el.classList.add('nope');
      sfx.wrong(); try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
      updateHud();
      S.marksT = setTimeout(clearMarks, S.diff === 0 ? 4000 : 2400);
      return;
    }
    // richtig!
    S.lock = true;
    S.streak++;
    const oldMult = S.mult;
    S.mult = Math.min(5, 1 + Math.floor(S.streak / 3));
    const nf = feats.length + (S.cfg.dests ? 1 : 0);
    const bonus = S.diff === 0 ? 20 : Math.round(60 * c.p);
    const pts = (40 + 20 * nf + bonus) * S.mult;
    S.score += pts; S.dayScore += pts; S.served++; S.totalServed++;
    S.results[c.idx] = 'ok';
    setMood(c, 'joy');
    const [hx, hy] = center(c.el);
    floatText(hx, hy - 40, '+' + pts);
    if (S.mult > oldMult) { setTimeout(() => floatText(hx, hy - 90, 'Serie ×' + S.mult + '!', 'big'), 250); sfx.combo(); }
    // Stempel
    const G = geo(S.sel, feats), pm = document.createElement('div');
    pm.className = 'postmark'; pm.innerHTML = POSTMARK;
    pm.style.left = ((G.sx + G.st / 2) / 2 - 24) + '%'; pm.style.top = ((G.sy + G.st / 2) / 1.4 - 14) + '%';
    $('letterWrap').appendChild(pm);
    sfx.stamp();
    removeCustomer(c, 'happy');
    for (let i = 0; i < 3; i++) setTimeout(() => floatText(hx + rnd(-30, 30), hy - 10, '♥', 'heart'), 120 + i * 140);
    const target = S.cfg.dests ? document.querySelector('.target.bin[data-v="' + bin + '"]') : $('mailbox');
    setTimeout(() => {
      const html = $('letterWrap').innerHTML.replace('<div id="marks"></div>', '');
      fly($('letterWrap'), target, html, () => {
        const [tx, ty] = center(target);
        burst(tx, ty, S.mult > 1 ? 70 : 45, S.mult > 1 ? 1.2 : 1);
        target.classList.remove('gulp'); void target.offsetWidth; target.classList.add('gulp');
        sfx.drop(); sfx.good();
      });
      sfx.whoosh();
      S.sel = {}; pm.remove(); renderLetter();
      S.lock = false;
      if (S.activeId === null) pickNextActive();
      updateHud(); renderDayBar(); updateEmpty();
    }, 380);
    updateHud(); renderDayBar();
  }
  function addMark(k, txt, q) {
    const [px, py] = markPos(k, S.sel, S.cfg.feats);
    const m = document.createElement('span');
    m.className = 'xmark' + (q ? ' qmark' : ''); m.dataset.k = k; m.textContent = txt;
    m.style.left = px + '%'; m.style.top = py + '%';
    $('marks').appendChild(m);
  }
  function fly(fromEl, toEl, html, done) {
    let fired = false; const fin = () => { if (!fired) { fired = true; done(); } };
    try {
      const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
      const f = document.createElement('div'); f.className = 'flyer'; f.innerHTML = html;
      Object.assign(f.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
      document.body.appendChild(f);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      const lift = Math.min(-60, dy * 0.2 - 80);
      if (f.animate) {
        const an = f.animate([
          { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
          { transform: 'translate(' + dx * .45 + 'px,' + (dy * .45 + lift) + 'px) scale(.62) rotate(-14deg)', opacity: 1, offset: .5 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.14) rotate(10deg)', opacity: .5 }
        ], { duration: 620, easing: 'ease-in' });
        an.onfinish = () => { f.remove(); fin(); };
      }
      setTimeout(() => { f.remove(); fin(); }, 800);
    } catch (e) { fin(); }
  }

  // ---------- HUD ----------
  function updateHud() {
    $('day').textContent = 'Tag ' + S.day;
    $('score').textContent = S.score.toLocaleString('de-DE');
    const cb = $('combo');
    if (S.mult > 1) {
      const txt = '×' + S.mult;
      if (cb.textContent !== txt || cb.classList.contains('hidden')) { cb.textContent = txt; cb.classList.remove('hidden', 'pop'); void cb.offsetWidth; cb.classList.add('pop'); }
    } else cb.classList.add('hidden');
    const h = $('hearts');
    if (S.diff === 0) h.innerHTML = '';
    else { let s = ''; for (let i = 0; i < 3; i++) s += '<span class="' + (i < S.hearts ? '' : 'lost') + '">' + heartSVG + '</span>'; if (h.dataset.v !== s) { h.innerHTML = s; h.dataset.v = s; } }
  }
  function renderDayBar() {
    const q = S.cfg ? S.cfg.quota : 0; let s = '';
    for (let i = 0; i < q; i++) s += '<i class="' + (S.results[i] || '') + '"></i>';
    $('dayBar').innerHTML = s;
  }
  function banner(txt) {
    const b = $('banner'); b.textContent = txt; b.classList.remove('hidden', 'show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(b._t); b._t = setTimeout(() => b.classList.add('hidden'), 1700);
  }

  // ---------- Ablauf ----------
  function bestGet() { try { return JSON.parse(LS.get('best-' + S.diff, 'null')) || { score: 0, day: 0 }; } catch (e) { return { score: 0, day: 0 }; } }
  function startGame() {
    audioInit();
    Object.assign(S, { day: 1, score: 0, hearts: 3, streak: 0, mult: 1, totalServed: 0, newRecord: false });
    startDay();
  }
  function startDay() {
    S.cfg = makeCfg(S.day, S.diff);
    Object.assign(S, { queue: [], activeId: null, spawned: 0, angry: 0, mistakes: 0, served: 0, dayScore: 0, results: [], sel: {}, lock: false, running: false, paused: false });
    $('queue').innerHTML = '';
    buildTrays(); buildTargets(); clearMarks(); renderLetter(); updateHud(); renderDayBar(); updateEmpty();
    showCard('intro');
  }
  function runDay() {
    hideCard(); audioInit();
    S.running = true; S.paused = false; S.spawnT = 1.0; S.endWait = 0;
    banner('Tag ' + S.day); musicStart(); updateEmpty();
  }
  function endDay() {
    S.running = false;
    const easy = S.diff === 0;
    S.stars = easy ? (S.mistakes <= 1 ? 3 : S.mistakes <= 3 ? 2 : 1) : (S.angry === 0 && S.mistakes <= 1 ? 3 : S.angry <= 1 && S.mistakes <= 3 ? 2 : 1);
    S.heartBack = !easy && S.hearts < 3;
    if (S.heartBack) S.hearts++;
    saveBest(S.day);
    sfx.day();
    showCard('day');
  }
  function saveBest(dayReached) {
    const b = bestGet();
    if (S.score > b.score || (S.score === b.score && dayReached > b.day)) {
      if (S.score > b.score && S.score > 0) S.newRecord = true;
      LS.set('best-' + S.diff, JSON.stringify({ score: Math.max(S.score, b.score), day: Math.max(dayReached, b.day) }));
    } else if (dayReached > b.day) LS.set('best-' + S.diff, JSON.stringify({ score: b.score, day: dayReached }));
  }
  function gameOver(quit) {
    S.running = false; S.paused = false; S.quit = quit;
    saveBest(S.day);
    sfx.over();
    showCard('over');
  }
  function pauseGame() {
    if (!S.running || S.paused) return;
    S.paused = true; showCard('pause');
  }
  function resume() { S.paused = false; hideCard(); }

  function update(dt) {
    const c = S.cfg;
    // Neue Kunden
    if (S.spawned < c.quota) {
      S.spawnT -= dt;
      if (!S.queue.length && S.spawnT > 1.2) S.spawnT = 1.2;
      if (S.spawnT <= 0 && S.queue.length < c.maxQ) { spawnCustomer(); S.spawnT = c.gap * rnd(0.8, 1.25); }
    }
    // Geduld
    for (const q of S.queue.slice()) {
      if (q.flashT > 0) q.flashT -= dt;
      if (S.diff === 0) { if (q.flashT <= 0) setMood(q, 'happy'); continue; }
      q.p -= dt / c.patience;
      if (q.bar) {
        q.bar.style.width = clamp(q.p * 100, 0, 100) + '%';
        q.bar.style.background = 'hsl(' + Math.round(clamp(q.p, 0, 1) * 120) + ' 80% 48%)';
      }
      if (q.flashT <= 0) setMood(q, q.p > 0.6 ? 'happy' : q.p > 0.3 ? 'ok' : 'angry');
      if (q.p <= 0) { customerLeavesAngry(q); if (!S.running) return; }
    }
    if (S.spawned >= c.quota && !S.queue.length && !S.lock) { S.endWait += dt; if (S.endWait > 1.1) endDay(); } else S.endWait = 0;
  }

  // ---------- Karten ----------
  function newsFor(day) {
    const c = makeCfg(day, S.diff), p = day > 1 ? makeCfg(day - 1, S.diff) : null, out = [];
    const pics = (arr, fn) => '<div class="pics">' + arr.map(fn).join('') + '</div>';
    if (!p) {
      out.push(pics(c.pools.color.slice(0, 3), it => optSVG('color', it)) + '<p>Wähle die richtige <b>Farbe</b> …</p>');
      out.push(pics(c.pools.stamp.slice(0, 3), it => optSVG('stamp', it)) + '<p>… und die passende <b>Briefmarke</b>.</p>');
    }
    if (c.pools.size && (!p || !p.pools.size)) out.push(pics(c.pools.size, it => optSVG('size', it)) + '<p><span class="tag">NEU</span>Achte auf die <b>Größe</b>!</p>');
    else if (p && c.pools.size && p.pools.size && c.pools.size.length > p.pools.size.length) out.push(pics(c.pools.size, it => optSVG('size', it)) + '<p><span class="tag">NEU</span>Jetzt gibt es auch <b>mittlere</b> Briefe.</p>');
    if (c.pools.seal && (!p || !p.pools.seal)) out.push(pics(c.pools.seal.slice(0, 3), it => optSVG('seal', it)) + '<p><span class="tag">NEU</span>Mach das richtige <b>Siegel</b> drauf!</p>');
    if (c.dests && (!p || !p.dests)) out.push(pics(c.dests.slice(0, 3), it => icon(it.v)) + '<p><span class="tag">NEU</span>Kein Briefkasten mehr: Wirf den Brief ins richtige <b>Fach</b>!' + (c.numbers ? ' Die <b>Zahl</b> in der Blase zeigt das Fach.' : '') + '</p>');
    else if (p && c.dests && p.dests && c.dests.length > p.dests.length) out.push(pics(c.dests.slice(-2), it => icon(it.v)) + '<p><span class="tag">NEU</span>Ein neues <b>Fach</b> ist dazugekommen.</p>');
    if (p && c.n > p.n) out.push(pics([c.pools.color[c.n - 1]], it => optSVG('color', it)) + pics([c.pools.stamp[c.n - 1]], it => optSVG('stamp', it)) + '<p><span class="tag">NEU</span>Mehr <b>Farben</b> und <b>Marken</b>!</p>');
    if (p ? c.maxQ > p.maxQ : c.maxQ > 1) out.push(pics(['capy', 'fox'].map(k => ANIMALS.find(a => a.k === k)), a => animalSVG(a, 'happy', '#60a5fa')) + '<p><span class="tag">NEU</span>Bis zu <b>' + c.maxQ + ' Kunden</b> auf einmal. Tipp einen Kunden an, um ihn zu bedienen.</p>');
    return out;
  }
  function helpHTML() {
    const bub = letterSVG({ color: 'blau', stamp: 'herz' }, ['color', 'stamp'], false);
    return '<h2>So geht’s</h2><div class="steps">' +
      '<div class="step"><span class="num">1</span><div class="pic">' + animalSVG(ANIMALS[0], 'happy', '#60a5fa') + '</div><p>Ein Tier kommt an den Schalter und zeigt in der Blase, welchen Brief es möchte.</p></div>' +
      '<div class="step"><span class="num">2</span><div class="pic">' + bub + '</div><p>Tipp unten die passenden Teile an: Farbe, Marke und später mehr.</p></div>' +
      '<div class="step"><span class="num">3</span><div class="pic">' + MAILBOX + '</div><p>Dann ab in den Briefkasten, später ins richtige Fach.</p></div>' +
      '<div class="step"><span class="num">4</span><div class="pic"><svg viewBox="0 0 100 20"><rect x="2" y="5" width="96" height="10" rx="5" fill="#ccc"/><rect x="2" y="5" width="40" height="10" rx="5" fill="#f59e0b"/></svg></div><p>Beeil dich! Wird der Balken leer, geht das Tier sauer weg und du verlierst ein Herz.</p></div>' +
      '<div class="step"><span class="num">5</span><div class="pic">' + starSVG() + '</div><p>Mehrere richtige Briefe hintereinander geben eine <b>Serie</b> mit mehr Punkten.</p></div>' +
      '</div><p class="muted">Ein <b>✗</b> zeigt dir, welches Teil noch falsch ist.</p>' +
      '<p class="keys"><kbd>Enter</kbd> abschicken · <kbd>P</kbd> Pause · <kbd>M</kbd> Ton</p>' +
      '<button class="btn" data-act="back">Alles klar!</button>';
  }
  const THEMES = [['auto', '🌗 Auto'], ['light', '☀️ Hell'], ['dark', '🌙 Dunkel']];
  function applyTheme() {
    const t = LS.get('theme', 'auto');
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  }
  function showCard(kind) {
    if (kind !== 'help') S.prevCard = kind;
    S.card = kind;
    let h = '';
    if (kind === 'start') {
      const b = bestGet(), th = THEMES.find(x => x[0] === LS.get('theme', 'auto')) || THEMES[0];
      h = '<div class="hero"><div class="h-animal">' + animalSVG(ANIMALS[0], 'joy', '#60a5fa') + '</div><div class="h-letter">' + letterSVG({ color: 'rot', stamp: 'herz', seal: 'krone' }, ['color', 'stamp', 'seal'], false) + '</div><div class="h-mail">' + MAILBOX + '</div></div>' +
        '<h1>Brief-Puzzle</h1><p>Hilf im Postamt! Pack jeden Brief genau so, wie die Tiere es sich wünschen.</p>' +
        '<div class="diffs">' + DIFFS.map((d, i) => '<button class="diff" data-act="diff" data-d="' + i + '" aria-pressed="' + (i === S.diff) + '"><span class="ico">' + d.ico + '</span><b>' + d.n + '</b><small>' + d.d + '</small></button>').join('') + '</div>' +
        '<p class="best">' + (b.score ? 'Bestwert: <b>' + b.score.toLocaleString('de-DE') + '</b> Punkte · bis Tag ' + b.day : 'Noch kein Bestwert – leg los!') + '</p>' +
        '<button class="btn" data-act="play" data-primary>Los geht’s!</button>' +
        '<div class="row"><button class="btn alt" data-act="help">❓ So geht’s</button><button class="btn alt" data-act="theme">' + th[1] + '</button></div>' +
        '<a class="back" href="../index.html">← Alle Spiele</a>';
    } else if (kind === 'help') {
      h = helpHTML();
    } else if (kind === 'intro') {
      const news = newsFor(S.day), a = ANIMALS[(S.day * 2) % ANIMALS.length];
      h = '<h1>Tag ' + S.day + '</h1>' +
        (news.length ? '<div class="news">' + news.map(n => '<div class="new">' + n + '</div>').join('') + '</div>' : '<p>Weiter so! Heute wird es etwas schneller.</p>') +
        '<p class="goal"><span style="width:40px">' + animalSVG(a, 'happy', '#f472b6') + '</span>Heute kommen <b>' + S.cfg.quota + '</b> Kunden.</p>' +
        '<button class="btn" data-act="go" data-primary>Los!</button>';
    } else if (kind === 'day') {
      h = '<h2>Tag ' + S.day + ' geschafft!</h2><div class="stars">' + [0, 1, 2].map(i => starSVG(i < S.stars)).join('') + '</div>' +
        '<div class="stats"><div class="stat">' + S.served + '<small>zufrieden</small></div>' +
        (S.diff === 0 ? '' : '<div class="stat">' + S.angry + '<small>sauer gegangen</small></div>') +
        '<div class="stat">' + S.mistakes + '<small>Fehler</small></div><div class="stat">+' + S.dayScore.toLocaleString('de-DE') + '<small>Punkte</small></div></div>' +
        (S.heartBack ? '<p>Du bekommst ein Herz zurück! <span style="display:inline-block;width:22px;vertical-align:middle">' + heartSVG + '</span></p>' : '') +
        '<button class="btn" data-act="next" data-primary>Weiter zu Tag ' + (S.day + 1) + ' ▶</button><button class="btn alt" data-act="quit">Feierabend machen</button>';
    } else if (kind === 'over') {
      const b = bestGet();
      h = '<div class="hero" style="height:100px"><div class="h-animal" style="width:90px">' + animalSVG(ANIMALS[0], S.quit ? 'happy' : 'ok', '#60a5fa') + '</div></div>' +
        '<h1>Feierabend!</h1>' + (S.quit ? '' : '<p>Drei Kunden sind sauer gegangen.</p>') +
        '<div class="big">' + S.score.toLocaleString('de-DE') + '</div><p class="muted">Punkte · ' + S.totalServed + ' Briefe verschickt · Tag ' + S.day + '</p>' +
        (S.newRecord ? '<div class="record">Neuer Bestwert!</div>' : '<p class="best">Bestwert: ' + b.score.toLocaleString('de-DE') + '</p>') +
        '<button class="btn" data-act="play" data-primary>Nochmal spielen</button><button class="btn alt" data-act="menu">Zum Menü</button>';
    } else if (kind === 'pause') {
      h = '<h1>Pause</h1><p>Die Tiere warten so lange.</p>' +
        '<button class="btn" data-act="resume" data-primary>Weiter</button>' +
        '<div class="row"><button class="btn alt" data-act="help">❓ So geht’s</button><button class="btn alt" data-act="quit">Feierabend</button></div>';
    }
    $('card').innerHTML = h;
    $('ov').classList.remove('hidden');
    if (kind === 'day') [0, 1, 2].forEach(i => setTimeout(() => {
      const st = $('card').querySelectorAll('.stars svg')[i]; if (!st || S.card !== 'day') return;
      st.classList.add('on'); if (i < S.stars) { sfx.star(i); const [x, y] = center(st); burst(x, y, 16, .6); }
    }, 350 + i * 320));
    setTimeout(() => { const p = $('card').querySelector('[data-primary]'); if (p) try { p.focus({ preventScroll: true }); } catch (e) {} }, 50);
  }
  function hideCard() { $('ov').classList.add('hidden'); S.card = null; }

  $('card').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    audioInit();
    const act = b.dataset.act;
    if (act === 'diff') { S.diff = +b.dataset.d; LS.set('diff', S.diff); sfx.tap(); S.cfg = makeCfg(1, S.diff); updateHud(); showCard('start'); }
    else if (act === 'play') startGame();
    else if (act === 'help') { sfx.tap(); showCard('help'); }
    else if (act === 'back') { sfx.tap(); showCard(S.prevCard || 'start'); }
    else if (act === 'theme') { const i = THEMES.findIndex(x => x[0] === LS.get('theme', 'auto')); LS.set('theme', THEMES[(i + 1) % 3][0]); applyTheme(); sfx.tap(); showCard('start'); }
    else if (act === 'go') runDay();
    else if (act === 'next') { S.day++; startDay(); }
    else if (act === 'resume') resume();
    else if (act === 'quit') gameOver(true);
    else if (act === 'menu') { musicStop(); showCard('start'); }
  });

  // ---------- Eingabe ----------
  $('trays').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) select(b.dataset.k, b.dataset.v); });
  $('targets').addEventListener('click', e => {
    const b = e.target.closest('.target'); if (!b) return;
    submit(b.classList.contains('bin') ? b.dataset.v : null);
  });
  $('clearBtn').addEventListener('click', () => { if (!S.running || S.paused || S.lock) return; S.sel = {}; clearMarks(); renderLetter(true); sfx.untap(); });
  $('pauseBtn').addEventListener('click', () => { audioInit(); if (S.running) pauseGame(); });
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); audioInit(); A.muted = !A.muted; applyMute(); LS.set('mute', A.muted ? '1' : '0');
  });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'm') { $('mute').click(); return; }
    if (k === 'p' || k === 'escape') {
      if (S.running && !S.paused) pauseGame();
      else if (S.card === 'pause') resume();
      else if (S.card === 'help') showCard(S.prevCard);
      return;
    }
    if ((k === 'enter' || k === ' ') && S.running && !S.paused && S.card === null) {
      e.preventDefault();
      if (!S.cfg.dests) submit(null);
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.running) pauseGame(); if (A.ctx) try { A.ctx.suspend(); } catch (e) {} }
    else if (A.ctx) try { A.ctx.resume(); } catch (e) {}
  });

  // ---------- Schleife ----------
  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0); last = ts;
    if (S.running && !S.paused) update(dt);
    fxStep(dt);
    requestAnimationFrame(frame);
  }

  // ---------- Start ----------
  $('sign').innerHTML = SIGN; $('lamp').innerHTML = LAMP;
  $('starIco').innerHTML = '<span style="display:inline-block;width:24px;height:24px">' + starSVG() + '</span>';
  $('pauseBtn').innerHTML = ICON_PAUSE; $('clearBtn').innerHTML = ICON_CLEAR;
  applyTheme(); applyMute(); resizeFx();
  S.cfg = makeCfg(1, S.diff); buildTrays(); buildTargets(); renderLetter(); updateHud(); renderDayBar();
  showCard('start');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
