<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capybara-Modenschau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff4e0; --bg2: #e3f4ff;
    --bar: rgba(255,255,255,.78); --fg: #3b2a4d; --muted: #7a6c8c;
    --panel: #ffffff; --panel2: #f6f1fb; --line: #e6ddf0;
    --accent: #ff7a59; --accentfg: #ffffff; --accent2: #6c5ce7; --ok: #20b36b;
    --star: #ffc531; --shadow: 0 6px 18px rgba(60,40,90,.14);
    --hint: #ffcf3f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #1d1830; --bg2: #14233a; --bar: rgba(30,25,50,.85); --fg: #f3eefb; --muted: #a99fc0;
      --panel: #272043; --panel2: #1f1a36; --line: #3b3260; --shadow: 0 6px 18px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #1d1830; --bg2: #14233a; --bar: rgba(30,25,50,.85); --fg: #f3eefb; --muted: #a99fc0;
    --panel: #272043; --panel2: #1f1a36; --line: #3b3260; --shadow: 0 6px 18px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--fg);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)); background-color: var(--bg1);
    overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 1280px; margin: 0 auto;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

  /* ---------- HUD ---------- */
  #hud { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  #hud .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .ibtn { width: 44px; height: 44px; border-radius: 14px; background: var(--bar); box-shadow: var(--shadow); font-size: 22px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .ibtn:active { transform: scale(.94); }
  .pill { background: var(--bar); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 17px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  #timer { font-variant-numeric: tabular-nums; }
  #timer.low { color: #fff; background: #e74c3c; animation: pulse .6s infinite alternate; }
  .hidden { display: none !important; }
  #title-s { font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Layout ---------- */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 10px 10px; }
  #stageWrap { flex: 0 0 auto; display: flex; justify-content: center; }
  #stage { position: relative; width: min(100%, calc((100dvh - 350px) * 10 / 9)); min-width: 220px; aspect-ratio: 10 / 9;
    border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #bfe6ff; }
  #stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  @media (min-aspect-ratio: 5/4), (min-width: 900px) and (min-aspect-ratio: 1/1) {
    main { flex-direction: row; align-items: stretch; }
    #stageWrap { flex: 1 1 auto; align-items: center; min-width: 0; }
    #stage { width: min(100%, calc((100dvh - 90px) * 10 / 9)); }
    #panel { flex: 0 0 min(430px, 42%); }
  }

  /* Theme banner on stage */
  #banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.92); color: #3b2a4d; border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    font-weight: 700; font-size: clamp(16px, 3.6vmin, 24px); white-space: nowrap; max-width: calc(100% - 20px); z-index: 3; }
  #banner .ic { font-size: 1.35em; line-height: 1; }
  #banner .nm { overflow: hidden; text-overflow: ellipsis; }
  #banner button { width: 38px; height: 38px; border-radius: 50%; background: #f1ebfa; font-size: 18px; flex: 0 0 auto; color: #3b2a4d; }
  #banner.pop { animation: bannerIn .5s cubic-bezier(.3,1.6,.5,1); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  #flash.go { animation: flash .5s ease-out; }
  #spot { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; z-index: 2;
    background: radial-gradient(ellipse 38% 60% at 50% 58%, rgba(255,255,230,0) 0%, rgba(255,255,230,0) 55%, rgba(10,5,30,.72) 100%); }
  #stage.runway #spot { opacity: 1; }
  #hearts { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .heart { position: absolute; font-size: 28px; animation: floatUp 1.1s ease-out forwards; }

  /* SVG item animation */
  .pop { transform-box: fill-box; transform-origin: 50% 60%; animation: popIn .45s cubic-bezier(.3,1.7,.5,1); }
  .out { transform-box: fill-box; transform-origin: 50% 60%; animation: popOut .22s ease-in forwards; }
  #capyBody { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  #stage.runway #capyWalk { animation: walk 2.4s ease-in-out; }
  #stage.runway #capyBody { animation: bob .3s ease-in-out 8 alternate; }
  #stage.wiggle #capyBody { animation: wiggle .5s ease-in-out; }

  /* ---------- Panel ---------- */
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 8px 0; flex: 0 0 auto; }
  .tab { position: relative; padding: 6px 2px 8px; border-radius: 16px 16px 0 0; background: var(--panel2); display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 58px; }
  .tab .ti { font-size: 26px; line-height: 1.1; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accentfg); }
  .tab .dot { position: absolute; top: 4px; right: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .tab .hdot { position: absolute; top: 2px; left: 6px; font-size: 14px; }
  #grid { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; align-content: start;
    border-top: 4px solid var(--accent); overscroll-behavior: contain; }
  .item { position: relative; border-radius: 16px; background: var(--panel2); border: 3px solid transparent; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 92px; transition: transform .12s, border-color .12s; }
  .item:hover { border-color: var(--line); }
  .item:active { transform: scale(.94); }
  .item svg { width: 100%; height: 64px; display: block; pointer-events: none; }
  .item .lbl { font-size: 12px; font-weight: 500; line-height: 1.1; color: var(--muted); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .item.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); }
  .item.on::after { content: "✓"; position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .item.hint { border-color: var(--hint); animation: glow 1s ease-in-out infinite alternate; }
  .item.hint::before { content: "✨"; position: absolute; top: -8px; left: -6px; font-size: 20px; }
  .item.new { animation: itemIn .35s ease-out both; }
  #actions { flex: 0 0 auto; display: flex; gap: 8px; padding: 8px; border-top: 1px solid var(--line); }
  .act { flex: 1; min-height: 54px; border-radius: 16px; background: var(--panel2); font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
  .act .e { font-size: 22px; }
  .act.primary { background: var(--accent); color: var(--accentfg); flex: 1.5; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .act.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .act:disabled { opacity: .45; cursor: default; }
  .act .cnt { background: rgba(0,0,0,.12); border-radius: 999px; padding: 0 7px; font-size: 14px; }

  /* ---------- Overlay cards ---------- */
  #ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(30,15,50,.45); z-index: 20; }
  #ov.clear { background: rgba(30,15,50,.18); }
  .card { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); color: var(--fg); border-radius: 24px; padding: 20px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: cardIn .35s cubic-bezier(.3,1.4,.5,1); text-align: center; }
  .card.wide { max-width: 640px; }
  .card h1 { font-size: 30px; line-height: 1.05; margin: 4px 0 6px; font-weight: 700; }
  .card h2 { font-size: 22px; margin: 4px 0 8px; font-weight: 700; }
  .card p { margin: 6px 0; font-size: 17px; line-height: 1.35; }
  .muted { color: var(--muted); }
  .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 18px; background: var(--accent); color: var(--accentfg); font-weight: 700; font-size: 20px; margin-top: 10px; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .btn.sec { background: var(--panel2); color: var(--fg); box-shadow: 0 4px 0 var(--line); }
  .btn .e { font-size: 26px; }
  .btn small { display: block; font-size: 13px; font-weight: 500; opacity: .85; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 2px; }
  .seg button { border-radius: 14px; border: 3px solid var(--line); padding: 6px 2px; font-weight: 600; font-size: 16px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .seg button .e { font-size: 24px; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--panel)); }
  .seg-desc { font-size: 14px; color: var(--muted); min-height: 20px; margin: 4px 0 0; }
  .logo { width: 150px; height: 150px; margin: -4px auto 0; display: block; }
  .best { font-size: 15px; color: var(--muted); margin-top: 8px; }
  .stars { font-size: 44px; letter-spacing: 4px; line-height: 1; margin: 6px 0; }
  .stars span { display: inline-block; filter: grayscale(1) opacity(.3); transform: scale(.6); transition: transform .3s cubic-bezier(.3,1.8,.5,1), filter .3s; }
  .stars span.lit { filter: none; transform: scale(1); }
  .photo { position: relative; width: min(100%, 360px); aspect-ratio: 10/9; margin: 4px auto 6px; border-radius: 16px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); transform: rotate(-2deg); background: #fff; }
  .photo svg { width: 100%; height: 100%; display: block; }
  .jury { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; text-align: left; }
  .say { display: flex; align-items: flex-start; gap: 8px; font-size: 16px; line-height: 1.3; }
  .say .who { font-size: 30px; line-height: 1; flex: 0 0 auto; }
  .say .bub { background: var(--panel2); border-radius: 4px 16px 16px 16px; padding: 7px 11px; }
  .pts { font-size: 18px; font-weight: 700; margin: 6px 0 0; }
  .tipbox { display: flex; align-items: center; gap: 8px; justify-content: center; background: color-mix(in srgb, var(--hint) 22%, var(--panel)); border-radius: 14px; padding: 6px 10px; margin-top: 6px; font-size: 16px; }
  .tipbox svg { width: 48px; height: 48px; flex: 0 0 auto; }
  .rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0 4px; }
  .rounds .mini { border-radius: 10px; overflow: hidden; aspect-ratio: 10/9; background: #fff; border: 2px solid var(--line); }
  .rounds .mini svg { width: 100%; height: 100%; display: block; }
  .rounds .st { font-size: 12px; letter-spacing: 0; }
  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 10px 0 4px; }
  .alb { border-radius: 14px; background: var(--panel2); padding: 4px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; }
  .alb .mini { width: 100%; aspect-ratio: 10/9; border-radius: 10px; overflow: hidden; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .alb .mini svg { width: 100%; height: 100%; display: block; }
  .alb.locked .mini { background: var(--line); filter: grayscale(.4); }
  .alb .st { font-size: 13px; letter-spacing: 1px; }
  .help { text-align: left; display: grid; gap: 10px; margin: 10px 0; }
  .help div { display: flex; gap: 10px; align-items: center; font-size: 17px; }
  .help .e { font-size: 30px; width: 40px; text-align: center; flex: 0 0 auto; }
  .kbd { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .trophy { font-size: 64px; line-height: 1; animation: bounce 1s ease-in-out infinite alternate; }
  .record { display: inline-block; background: var(--star); color: #5a3a00; font-weight: 700; border-radius: 999px; padding: 3px 12px; font-size: 16px; margin: 4px 0; animation: pulse .6s infinite alternate; }
  .row.small { margin-top: 6px; }
  .row.small .btn { min-height: 44px; font-size: 16px; }
  .total { font-size: 32px; font-weight: 700; margin: 4px 0; }
  @media (min-aspect-ratio: 5/4) and (min-width: 700px) {
    #grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .item { min-height: 118px; }
    .item svg { height: 88px; }
    .item .lbl { font-size: 13px; }
  }
  @media (max-width: 480px) {
    #themeB { display: none; }
    .lw { display: none; }
  }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #3b2a4d; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 16px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @keyframes popIn { 0% { transform: translateY(-30px) scale(.4); opacity: 0; } 60% { transform: translateY(3px) scale(1.12); opacity: 1; } 100% { transform: none; } }
  @keyframes popOut { to { transform: translateY(20px) scale(.3); opacity: 0; } }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, .988); } }
  @keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-7px) rotate(2deg); } }
  @keyframes walk { 0% { transform: translateX(0); } 25% { transform: translateX(-40px); } 60% { transform: translateX(40px); } 100% { transform: translateX(0); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  @keyframes cardIn { from { transform: translateY(30px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bannerIn { from { transform: translateX(-50%) scale(.3); } to { transform: translateX(-50%) scale(1); } }
  @keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--hint) 70%, transparent); } to { box-shadow: 0 0 0 6px color-mix(in srgb, var(--hint) 30%, transparent); } }
  @keyframes itemIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes floatUp { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-90px) scale(1.2); opacity: 0; } }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 380px) {
    .ibtn { width: 40px; height: 40px; font-size: 20px; }
    .pill { font-size: 15px; padding: 5px 9px; }
    #title-s { font-size: 16px; }
    .act { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="ibtn" id="home" aria-label="Menü">🏠</button>
    <div class="grow">
      <span class="pill" id="roundP">1/5</span>
      <span class="pill" id="starP">⭐ 0</span>
      <span class="pill hidden" id="timer">⏱ 45</span>
      <span id="title-s" class="hidden">Capybara-Modenschau</span>
    </div>
    <button class="ibtn" id="help" aria-label="Hilfe">❓</button>
    <button class="ibtn" id="themeB" aria-label="Hell oder dunkel">🌙</button>
    <button class="ibtn" id="mute" aria-label="Ton aus">🔊</button>
  </header>
  <main>
    <div id="stageWrap">
      <div id="stage">
        <svg id="stageSvg" viewBox="0 0 400 360" preserveAspectRatio="xMidYMid slice" aria-label="Capybara"></svg>
        <div id="spot"></div>
        <div id="hearts"></div>
        <div id="flash"></div>
        <div id="banner"><span class="ic" id="bIc">🏖️</span><span class="nm" id="bNm">Strandparty</span><button id="speak" aria-label="Vorlesen">🔈</button></div>
      </div>
    </div>
    <section id="panel">
      <div id="tabs" role="tablist"></div>
      <div id="grid" role="tabpanel"></div>
      <div id="actions"></div>
    </section>
  </main>
</div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<!-- Grafiken: Capybara zuerst, dann die Teile je Kategorie (Format siehe art/STYLE.md) -->
<script src="art/capybara.js"></script>
<script src="art/kopf.js"></script>
<script src="art/ober.js"></script>
<script src="art/extra.js"></script>
<script src="art/hand.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('anziehen2-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('anziehen2-' + k, JSON.stringify(v)); } catch (e) {} }
  };
  // Grafiken kommen aus art/*.js (window.ART, Koordinaten 240x300, siehe art/STYLE.md)
  const ART = window.ART;
  const CAPY_TF = 'translate(86 38) scale(.95)';   // Lage der 240x300-Zeichnung in der Bühne (400x360)

  // ---------- Themen ----------
  const THEMEN = [
    { name: 'Strandparty', icon: '🏖️', scene: 'strand' },
    { name: 'Eleganter Abend', icon: '🎩', scene: 'gala' },
    { name: 'Abenteuerzeit', icon: '🗺️', scene: 'dschungel' },
    { name: 'Gemütlicher Winter', icon: '❄️', scene: 'winter' },
    { name: 'Rockstar', icon: '🎸', scene: 'buehne' },
    { name: 'Piratenabenteuer', icon: '🏴‍☠️', scene: 'meer' },
    { name: 'Meisterkoch', icon: '👨‍🍳', scene: 'kueche' },
    { name: 'Weltraummission', icon: '🚀', scene: 'weltall' },
    { name: 'Superheld', icon: '🦸', scene: 'stadt' },
    { name: 'Bauernhof', icon: '🌾', scene: 'hof' },
    { name: 'Detektiv', icon: '🔍', scene: 'gasse' },
    { name: 'Cowboy', icon: '🤠', scene: 'wueste' },
    { name: 'Tourist', icon: '📸', scene: 'reise' },
    { name: 'Ninja', icon: '🥷', scene: 'dojo' },
    { name: 'Magier', icon: '🪄', scene: 'zauber' },
    { name: 'Filmstar', icon: '🌟', scene: 'teppich' },
    { name: 'Wanderer', icon: '🥾', scene: 'berge' },

  function evaluate() {

      (rec ? '<div class="record">🎉 Neuer Bestwert!</div>' : '<div class="best">' + bestLine(best) + '</div>') +
      '<div class="rounds">' + S.results.map(r => '<div><div class="mini">' + outfitSvg(r.scene, r.worn, { wrap: true }) + '</div><div class="st">' + '⭐'.repeat(r.stars) + (r.stars ? '' : '–') + '</div></div>').join('') + '</div>' +
      '<button class="btn" id="eAgain" data-focus><span class="e">🔁</span>Nochmal</button><div class="row"><button class="btn sec" id="eAlbum">📒 Album</button><button class="btn sec" id="eMenu">🏠 Menü</button></div>', { wide: false });
    sfx.fanfare(); if (stars >= 9) setTimeout(() => confetti(200), 200);
    $('eAgain').onclick = () => startShow();
    $('eAlbum').onclick = () => showAlbum();
    $('eMenu').onclick = () => menu();
  }

  // ---------- Ankleidezimmer ----------
  const SCENE_LIST = [['strand', '🏖️ Strand'], ['gala', '🎩 Ballsaal'], ['dschungel', '🌴 Dschungel'], ['winter', '❄️ Winter'], ['buehne', '🎸 Bühne'], ['meer', '🏴‍☠️ Schiff'], ['kueche', '🍳 Küche'], ['weltall', '🚀 Weltall'], ['stadt', '🌃 Stadt'], ['hof', '🌾 Bauernhof'], ['gasse', '🔍 Gasse'], ['wueste', '🌵 Wüste'], ['reise', '🗼 Reise'], ['dojo', '🥷 Dojo'], ['zauber', '🪄 Zauberwald'], ['teppich', '🌟 Roter Teppich'], ['berge', '⛰️ Berge'], ['stadion', '🏟️ Stadion'], ['zirkus', '🎪 Zirkus'], ['labor', '🕵️ Geheimlabor']];
  function startFree(init) {
    stopTimer(); musicStop(); hideCard();
    const saved = init || store.get('free', null) || {};
    S.mode = 'free'; S.theme = null; S.busy = false; S.hintOn = false; S.tab = 'kopf';
    S.worn = {}; if (saved.worn) for (const k in saved.worn) if (IT[saved.worn[k]] && IT[saved.worn[k]].slot === k) S.worn[k] = saved.worn[k];
    S.scene = SCENES[saved.scene] ? saved.scene : 'strand';
    S.offer = {}; SLOTS.forEach(sl => S.offer[sl.id] = itemsOf(sl.id).map(i => i.id));
    $('roundP').classList.add('hidden'); $('starP').classList.add('hidden'); $('timer').classList.add('hidden'); $('title-s').classList.remove('hidden'); $('title-s').textContent = 'Ankleidezimmer';
    $('speak').classList.add('hidden');
    freeBanner(false); renderStage(); renderPanel(true);
    if (musicOn) musicStart(false);
    store.set('free', { worn: S.worn, scene: S.scene });
  }
  function freeBanner(pop) { const s = SCENE_LIST.find(x => x[0] === S.scene) || SCENE_LIST[0]; const sp = s[1].indexOf(' '); setBanner(s[1].slice(0, sp), s[1].slice(sp + 1), pop); }
  function nextScene() {
    const i = SCENE_LIST.findIndex(x => x[0] === S.scene);
    S.scene = SCENE_LIST[(i + 1) % SCENE_LIST.length][0]; sfx.whoosh(); freeBanner(true); renderStage();
    store.set('free', { worn: S.worn, scene: S.scene });
  }
  function randomOutfit() {
    S.worn = {}; SLOTS.forEach(sl => { if (Math.random() < 0.85) S.worn[sl.id] = pick(itemsOf(sl.id)).id; });
    sfx.on(); renderStage(); const st = $('stage'); st.classList.remove('wiggle'); void st.offsetWidth; st.classList.add('wiggle');
    renderTabs(); renderGrid(false); store.set('free', { worn: S.worn, scene: S.scene });
  }

  // ---------- Foto (PNG über Canvas) ----------
  function loadImg(src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  }
  async function photo(sceneKey, worn, caption, stars) {
    audioInit(); sfx.shutter();
    const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    try {
      const K = 2, W = 400 * K, H = 360 * K, PAD = 24, CAP = 110;
      const cv = document.createElement('canvas'); cv.width = W + PAD * 2; cv.height = H + PAD + CAP;
      const c = cv.getContext('2d');
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
      const svg = outfitSvg(sceneKey, worn, { wrap: true, size: [W, H] });
      const im = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
      c.drawImage(im, PAD, PAD, W, H);
      c.fillStyle = '#3b2a4d'; c.textAlign = 'center'; c.font = '600 44px Fredoka, "Segoe UI", sans-serif';
      c.fillText(caption || 'Mein Capybara', cv.width / 2, H + PAD + 62);
      if (stars != null) { c.font = '34px sans-serif'; c.fillText('⭐'.repeat(stars), cv.width / 2, H + PAD + 100); }
      const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'capybara-' + (caption || 'outfit').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('📷 Foto gespeichert!');
    } catch (e) {
      toast('Das Foto hat leider nicht geklappt.');
    }
  }

  // ---------- Konfetti ----------
  const cf = $('confetti'), cx = cf.getContext('2d'); let parts = [], cfRun = false;
  function confetti(n) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cf.width = innerWidth * dpr; cf.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#ff6b6b', '#ffd43b', '#4dabf7', '#69db7c', '#da77f2', '#ff922b'];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * 0.35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: pick(cols), life: 1 });
    if (!cfRun) { cfRun = true; requestAnimationFrame(cfStep); }
  }
  function cfStep() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y > innerHeight + 20) p.life = 0;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    parts = parts.filter(p => p.life > 0);
    if (parts.length) requestAnimationFrame(cfStep); else { cfRun = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Eingaben ----------
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b || S.busy) return;
    audioInit(); S.tab = b.dataset.s; sfx.tab(); renderTabs(); renderGrid(true); $('grid').scrollTop = 0;
  });
  $('grid').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) toggleItem(b.dataset.id); });
  $('actions').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return; audioInit();
    if (b.id === 'aDone') finishRound();
    else if (b.id === 'aHint') useHint();
    else if (b.id === 'aClear') { if (S.busy) return; S.worn = {}; sfx.off(); renderStage(); renderTabs(); renderGrid(false); if (S.mode === 'free') store.set('free', { worn: S.worn, scene: S.scene }); }
    else if (b.id === 'aScene') nextScene();
    else if (b.id === 'aRand') randomOutfit();
    else if (b.id === 'aPhoto') { const s = SCENE_LIST.find(x => x[0] === S.scene); photo(S.scene, S.worn, s ? s[1].slice(s[1].indexOf(' ') + 1) : '', null); }
  });
  $('speak').onclick = () => { audioInit(); if (S.theme) speak(S.theme.name); };
  $('home').onclick = () => { audioInit(); sfx.tap(); menu(); };
  $('help').onclick = () => { audioInit(); sfx.tap(); const wasOpen = !$('ov').classList.contains('hidden'); if (S.mode === 'menu' || wasOpen) showHelp(S.mode === 'menu' ? menu : null); else showHelp(null); };
  $('themeB').onclick = () => {
    const dark = themePref ? themePref === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    themePref = dark ? 'light' : 'dark'; store.set('theme', themePref); applyTheme(); sfx.tap();
  };
  $('mute').onclick = e => { e.stopPropagation(); audioInit(); A.muted = !A.muted; store.set('mute', A.muted); applyMute(); };
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { $('mute').click(); return; }
    if (!$('ov').classList.contains('hidden')) return;
    if (S.mode === 'menu') return;
    if (k >= '1' && k <= '4') { S.tab = SLOTS[+k - 1].id; audioInit(); sfx.tab(); renderTabs(); renderGrid(true); }
    else if (k === 'h' && S.mode === 'show') useHint();
    else if (k === 'enter' && S.mode === 'show' && document.activeElement && !document.activeElement.closest('#grid, #tabs')) { e.preventDefault(); finishRound(); }
    else if (k === 'escape') menu();
  });

  // Start
  applyMute();
  S.scene = 'strand'; renderStage(); setBanner('🏖️', 'Capybara-Modenschau', false);
  S.offer = {}; SLOTS.forEach(sl => S.offer[sl.id] = itemsOf(sl.id).map(i => i.id)); renderPanel(false);
  menu();
  // Kleiner Test-Zugang (für automatisierte Tests)
  window.__capy = { S, IT, ITEMS, THEMEN, SLOTS, evaluate: () => evaluate() };
})();
</script>
