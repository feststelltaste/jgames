<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7ec; --bg2: #ffe9f3; --fg: #3b2f55; --muted: #7a6f93;
    --card: #ffffff; --line: #f1e3ef; --accent: #ff6fb5; --accentfg: #ffffff;
    --new: #16a34a; --shadow: 0 10px 30px rgba(80, 40, 90, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17132a; --bg2: #221a3a; --fg: #f3eef8; --muted: #a79fbd;
      --card: #231c3c; --line: #3a3058; --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17132a; --bg2: #221a3a; --fg: #f3eef8; --muted: #a79fbd;
    --card: #231c3c; --line: #3a3058; --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%); }
  body {
    margin: 0; color: var(--fg);
    font-family: "Fredoka", "Segoe UI", system-ui, sans-serif;
  }
  header { text-align: center; padding: 40px 16px 24px; }
  .logo { font-size: 56px; line-height: 1; }
  h1 { font-size: clamp(40px, 8vw, 64px); margin: 8px 0 4px; letter-spacing: -1px; }
  header p { margin: 0; color: var(--muted); font-size: 19px; }
  main {
    max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px;
    display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .game {
    background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow);
    border: 1px solid var(--line); display: flex; flex-direction: column;
    transition: transform .2s, box-shadow .2s;
  }
  .game:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(80, 40, 90, .18); }
  .shot { position: relative; display: block; aspect-ratio: 4 / 3; background: var(--line); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; margin: 0; }
  .desc { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; flex: 1; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .btn {
    flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 10px 16px; border-radius: 14px; text-decoration: none;
    font-weight: 600; font-size: 18px; background: var(--accent); color: var(--accentfg);
  }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  footer { text-align: center; color: var(--muted); padding: 0 16px 32px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo">🎮</div>
  <h1>JGames</h1>
  <p>Such dir ein Spiel aus!</p>
</header>
<main id="games"></main>
<footer>Alle Spiele laufen direkt im Browser, auf dem Handy und am Computer.</footer>
<script>
  // Neues Spiel: hier eintragen und mit tools/screenshots.js ein In-Game-Bild nach screenshots/ legen.
  const GAMES = [
    { title: 'Letzte Linie', icon: '🎈', href: 'letzte-linie/index.html', shot: 'letzte-linie',
      desc: 'Rechen-Shooter: Deine Gruppe spritzt Luftballons ab oder hält Zombies auf. Lauf durch das Tor mit dem richtigen Ergebnis, dann bekommst du Verstärkung. Mit Plus und Minus, Einmaleins und selbst gewählten Reihen.' },
    { title: 'Brief-Puzzle', icon: '✉️', href: 'postamt_2/index.html', shot: 'postamt_2',
      desc: 'Du arbeitest am Postschalter: Tiere zeigen dir ihren Wunschbrief. Bau ihn schnell zusammen, bevor sie ungeduldig werden, und sortier ihn ins richtige Fach.' },
    { title: 'Capybara Fluss-Lauf', icon: '🌊', href: 'flussfahrt_2/index.html', shot: 'flussfahrt_2',
      desc: 'Paddle mit Capy den Fluss hinunter: Sammle Orangen, weiche Piranhas, Baumstämmen, Strudeln und Krokodilen aus und schaffe alle fünf Abschnitte.' },
    { title: 'Zieh das Capybara an', icon: '👒', href: 'anziehen_2/index.html', shot: 'anziehen_2',
      desc: 'Modenschau in fünf Runden: Zieh das Capybara passend zum Thema an, schick es über den Laufsteg und hol dir Sterne von der Jury. Dazu ein Ankleidezimmer zum freien Spielen und ein Sammelalbum.' }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  document.getElementById('games').innerHTML = GAMES.map(g =>
    '<article class="game">' +
      '<a class="shot" href="' + esc(g.href) + '" tabindex="-1" aria-hidden="true">' +
        '<img src="screenshots/' + esc(g.shot) + '.jpg" alt="" loading="lazy" width="800" height="600"></a>' +
      '<div class="body">' +
        '<h2 class="title"><span aria-hidden="true">' + g.icon + '</span>' + esc(g.title) + '</h2>' +
        '<p class="desc">' + esc(g.desc) + '</p>' +
        '<div class="actions"><a class="btn" href="' + esc(g.href) + '">Spielen</a></div>' +
      '</div></article>'
  ).join('');
</script>
</body>
</html>
